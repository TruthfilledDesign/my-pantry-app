<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wong's Kitchen 🌿</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #EAE4D9; --panel: #DCD3C1; --card: #FDFBFA;
            --text-main: #3E3A37; --text-soft: #7C7874; --radius: 20px;
            --low-alert: #B68576;
            /* Planner Palette */
            --planner-bg: #CFD4CD; --planner-panel: #B8BEB6; --planner-accent: #5E6B5E;
        }
        .theme-sage { --pop: #A8B29C; --header-text: #2D3A2D; }
        .theme-burgundy { --pop: #B68576; --header-text: #FDFBFA; }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; transition: background 0.3s; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; margin: 0; }

        .app-container { width: 100%; max-width: 480px; min-height: 100vh; margin: 0 auto; position: relative; }

        /* --- LOGO --- */
        .logo-wrap { display: flex; flex-direction: column; align-items: center; margin: 20px 0 10px; }
        .logo-emblem { width: 50px; height: 50px; background: var(--pop); border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .logo-emblem::after { content: ''; position: absolute; width: 12px; height: 16px; background: var(--card); border-radius: 50% 50% 40% 40%; transform: translateY(6px); }
        .logo-emblem::before { content: ''; position: absolute; width: 3px; height: 24px; background: var(--card); border-radius: 2px; transform: translateY(-8px); }
        .logo-leaf { position: absolute; width: 8px; height: 12px; background: var(--bg); border-radius: 0 10px 0 10px; top: 15px; right: 12px; transform: rotate(20deg); }

        /* Navigation */
        .header-bg { padding: 15px 20px; position: relative; z-index: 10; }
        .menu-trigger { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-main); }
        
        /* Sidebar (REVERTED TO ORIGINAL STATE) */
        .side-panel { position: fixed; top: 0; left: -100%; width: 280px; height: 100%; background: var(--card); z-index: 1000; padding: 25px 20px; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 10px 0 40px rgba(0,0,0,0.08); overflow-y: auto; }
        .side-panel.open { left: 0; }
        .overlay { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.15); backdrop-filter: blur(4px); z-index: 999; }

        .accordion-btn { width: 100%; text-align: left; background: none; border: none; font-weight: 700; padding: 15px 0; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; }
        .accordion-content { display: none; padding: 10px 0; }
        .accordion-content.active { display: block; }
        
        .circle-x { position: absolute; top: 20px; right: 20px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* Grid */
        .content { padding: 0 20px 100px; }
        .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .section-card { background: var(--panel); padding: 15px; border-radius: var(--radius); text-align: center; cursor: pointer; }
        
        /* Planner */
        .planner-mode { background-color: var(--planner-bg) !important; }
        .planner-drop { width: 100%; background: var(--planner-panel); border: none; padding: 15px; border-radius: 12px; font-weight: 700; margin-bottom: 8px; text-align: left; display: flex; justify-content: space-between; cursor: pointer; }
        .day-box { background: var(--card); border-radius: 15px; padding: 12px; margin-bottom: 10px; }
        .meal-slot { padding: 10px; background: #f4f6f5; border-radius: 10px; margin-top: 5px; cursor: pointer; border-left: 4px solid var(--planner-accent); }

        /* Modals */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); z-index:2000; align-items:center; justify-content:center; }
        .modal-content { background: var(--card); width: 88%; max-width: 360px; padding: 25px; border-radius: 28px; max-height: 85vh; overflow-y: auto; position: relative; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0; border-radius: 10px; border: 1px solid #ddd; background: #f9f9f9; font-family: inherit; box-sizing: border-box; }
        .btn-save { background: var(--text-main); color: white; width: 100%; padding: 14px; border: none; border-radius: 50px; font-weight: 700; cursor: pointer; margin-top: 10px; }

        .fab { position: fixed; bottom: 30px; right: 20px; width: 60px; height: 60px; background: var(--text-main); border-radius: 20px; color: white; border: none; font-size: 30px; cursor: pointer; z-index: 800; }
    </style>
</head>
<body class="theme-sage">

<div class="app-container" id="app">
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="side-panel" id="sidePanel">
        <div class="circle-x" onclick="toggleMenu()">×</div>
        <h2 style="margin-top:30px">Menu</h2>
        <div onclick="goHome()" style="padding:15px 0; border-bottom:1px solid #eee; cursor:pointer; font-weight:700;">🏠 Home</div>
        <div onclick="openPlanner()" style="padding:15px 0; border-bottom:1px solid #eee; cursor:pointer; font-weight:700;">🗓️ Menu Planner</div>
        
        <button class="accordion-btn" onclick="toggleAccordion('lowAcc')">📋 Running Low <span>▾</span></button>
        <div id="lowAcc" class="accordion-content">
            <div id="lowItems"></div>
        </div>

        <button class="accordion-btn" onclick="toggleAccordion('shopAcc')">🛒 Shopping List <span>▾</span></button>
        <div id="shopAcc" class="accordion-content">
            <div id="shopItems"></div>
        </div>

        <div style="margin-top:20px">
            <label style="font-size:10px; font-weight:800; color:var(--text-soft)">STYLE</label>
            <select id="themeSelect" onchange="changeTheme(this.value)"><option value="theme-sage">Sage</option><option value="theme-burgundy">Burgundy</option></select>
        </div>
    </div>

    <div class="header-bg"><button class="menu-trigger" onclick="toggleMenu()">☰</button></div>

    <div class="logo-wrap">
        <div class="logo-emblem"><div class="logo-leaf"></div></div>
        <h1 style="margin-top:10px">Wong's Kitchen</h1>
    </div>

    <div class="content">
        <div class="section-grid" id="mainGrid"></div>

        <div id="sectionView" style="display:none; position:relative;">
            <div class="circle-x" style="top:0; right:0;" onclick="goHome()">×</div>
            <h2 id="viewTitle" style="margin-bottom:20px;">Section</h2>
            <div id="itemList"></div>
        </div>

        <div id="plannerView" style="display:none; position:relative;">
            <div class="circle-x" style="top:0; right:0;" onclick="goHome()">×</div>
            <h2 style="margin-bottom:20px;">Menu Planner</h2>
            <div id="plannerContent"></div>
        </div>
    </div>

    <button class="fab" onclick="openModal()">+</button>
</div>

<div id="mealModal" class="modal">
    <div class="modal-content">
        <div class="circle-x" onclick="closeMealModal()">×</div>
        <h2 id="mealHead">Meal Details</h2>
        <input type="text" id="mealDish" placeholder="Dish Name">
        <textarea id="mealNotes" placeholder="Notes..." rows="3"></textarea>
        <button class="btn-save" onclick="saveMeal()">Save Plan</button>
        <button class="btn-save" style="background:#888;" onclick="copyMeal()">Copy</button>
        <button id="pasteBtn" class="btn-save" style="display:none; background:var(--pop);" onclick="pasteMeal()">Paste Clipboard</button>
    </div>
</div>

<div id="itemModal" class="modal">
    <div class="modal-content">
        <div class="circle-x" onclick="closeModal()">×</div>
        <h2 id="itemModalHead">Add Item</h2>
        <input type="text" id="itemName" placeholder="Name">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <input type="number" id="itemQty" placeholder="Qty">
            <input type="text" id="itemUnit" placeholder="Unit">
        </div>
        <select id="itemSec"></select>
        <div style="display:flex; gap:15px; background:#f1efea; padding:10px; border-radius:12px; margin:10px 0;">
            <label style="font-size:12px;"><input type="checkbox" id="checkLow"> Low</label>
            <label style="font-size:12px;"><input type="checkbox" id="checkShop"> Shop</label>
        </div>
        <button class="btn-save" onclick="saveItem()">Save Item</button>
        <button id="delBtn" onclick="deleteItem()" style="display:none; width:100%; background:none; border:none; color:maroon; margin-top:15px; font-weight:700;">DELETE</button>
    </div>
</div>

<script>
    let inventory = JSON.parse(localStorage.getItem('wk_inv')) || [];
    let categories = JSON.parse(localStorage.getItem('wk_sec')) || ["Fridge", "Pantry", "Freezer"];
    let weekPlans = JSON.parse(localStorage.getItem('wk_plans')) || {};
    let clipboard = null;
    let curIdx = null;

    function renderHome() {
        document.getElementById('app').classList.remove('planner-mode');
        document.getElementById('mainGrid').style.display = 'grid';
        document.getElementById('sectionView').style.display = 'none';
        document.getElementById('plannerView').style.display = 'none';
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = categories.map(c => `
            <div class="section-card" onclick="openSection('${c}')">
                <b style="font-size:18px;">${c}</b><br>
                <small>${inventory.filter(i=>i.section===c).length} ITEMS</small>
            </div>
        `).join('');
    }

    function openSection(name) {
        document.getElementById('mainGrid').style.display = 'none';
        document.getElementById('sectionView').style.display = 'block';
        document.getElementById('viewTitle').innerText = name;
        const list = document.getElementById('itemList');
        list.innerHTML = inventory.filter(i => i.section === name).map(item => {
            const idx = inventory.indexOf(item);
            return `<div class="item-row" style="background:white; padding:15px; border-radius:15px; margin-bottom:10px; display:flex; justify-content:space-between;" onclick="openModal(${idx})">
                        <div><b>${item.name}</b><br><small style="color:gray">${item.qty} ${item.unit}</small></div>
                        <span>✎</span>
                    </div>`;
        }).join('');
    }

    /* Planner */
    function openPlanner() {
        if(document.getElementById('sidePanel').classList.contains('open')) toggleMenu();
        document.getElementById('app').classList.add('planner-mode');
        document.getElementById('mainGrid').style.display = 'none';
        document.getElementById('sectionView').style.display = 'none';
        document.getElementById('plannerView').style.display = 'block';
        renderPlanner();
    }

    function renderPlanner() {
        const cont = document.getElementById('plannerContent');
        cont.innerHTML = '';
        const weeks = ["Current Week", "Next Week"];
        weeks.forEach(w => {
            const drop = document.createElement('div');
            drop.className = 'planner-drop';
            drop.onclick = () => drop.nextElementSibling.classList.toggle('active');
            drop.innerHTML = `<span>${w}</span><span>▾</span>`;
            const inner = document.createElement('div');
            inner.className = 'accordion-content';
            ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].forEach(day => {
                const key = `${w}-${day}`;
                const data = weekPlans[key] || {};
                const box = document.createElement('div');
                box.className = 'day-box';
                box.innerHTML = `<h4>${day}</h4>`;
                ["Lunch", "Dinner"].forEach(type => {
                    const meal = data[type] || { dish: '—' };
                    const slot = document.createElement('div');
                    slot.className = 'meal-slot';
                    slot.onclick = () => openMealModal(key, type);
                    slot.innerHTML = `<b>${type}:</b> ${meal.dish}`;
                    box.appendChild(slot);
                });
                inner.appendChild(box);
            });
            cont.appendChild(drop); cont.appendChild(inner);
        });
    }

    function openMealModal(key, type) {
        window.activeMealKey = key; window.activeMealType = type;
        const data = (weekPlans[key] && weekPlans[key][type]) || { dish: '', notes: '' };
        document.getElementById('mealDish').value = data.dish;
        document.getElementById('mealNotes').value = data.notes;
        document.getElementById('pasteBtn').style.display = clipboard ? 'block' : 'none';
        document.getElementById('mealModal').style.display = 'flex';
    }

    function saveMeal() {
        if(!weekPlans[window.activeMealKey]) weekPlans[window.activeMealKey] = {};
        weekPlans[window.activeMealKey][window.activeMealType] = {
            dish: document.getElementById('mealDish').value,
            notes: document.getElementById('mealNotes').value
        };
        localStorage.setItem('wk_plans', JSON.stringify(weekPlans));
        closeMealModal(); renderPlanner();
    }

    function copyMeal() {
        clipboard = { dish: document.getElementById('mealDish').value, notes: document.getElementById('mealNotes').value };
        alert("Copied!");
    }

    function pasteMeal() {
        document.getElementById('mealDish').value = clipboard.dish;
        document.getElementById('mealNotes').value = clipboard.notes;
        saveMeal();
    }

    /* Standard Modals */
    function openModal(idx = null) {
        curIdx = idx;
        document.getElementById('itemSec').innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
        if(idx !== null) {
            const i = inventory[idx];
            document.getElementById('itemName').value = i.name;
            document.getElementById('itemQty').value = i.qty;
            document.getElementById('itemUnit').value = i.unit;
            document.getElementById('itemSec').value = i.section;
            document.getElementById('checkLow').checked = i.isLow;
            document.getElementById('checkShop').checked = i.onShop;
            document.getElementById('delBtn').style.display = 'block';
        } else {
            document.querySelectorAll('#itemModal input').forEach(el => { if(el.type !== 'checkbox') el.value = ''; });
            document.getElementById('delBtn').style.display = 'none';
        }
        document.getElementById('itemModal').style.display = 'flex';
    }

    function saveItem() {
        const data = {
            name: document.getElementById('itemName').value,
            qty: document.getElementById('itemQty').value,
            unit: document.getElementById('itemUnit').value,
            section: document.getElementById('itemSec').value,
            isLow: document.getElementById('checkLow').checked,
            onShop: document.getElementById('checkShop').checked
        };
        if(curIdx !== null) inventory[curIdx] = data;
        else inventory.push(data);
        localStorage.setItem('wk_inv', JSON.stringify(inventory));
        closeModal(); renderHome();
    }

    function deleteItem() { inventory.splice(curIdx, 1); localStorage.setItem('wk_inv', JSON.stringify(inventory)); closeModal(); renderHome(); }
    function changeTheme(t) { document.body.className = t; localStorage.setItem('wk_theme', t); }
    function toggleMenu() { document.getElementById('sidePanel').classList.toggle('open'); document.getElementById('overlay').style.display = document.getElementById('sidePanel').classList.contains('open') ? 'block' : 'none'; renderSidebar(); }
    function toggleAccordion(id) { document.getElementById(id).classList.toggle('active'); }
    function renderSidebar() {
        document.getElementById('lowItems').innerHTML = inventory.filter(i=>i.isLow).map(i => `<div style="padding:5px 0;">• ${i.name}</div>`).join('');
        document.getElementById('shopItems').innerHTML = inventory.filter(i=>i.onShop).map(i => `<div style="padding:5px 0;">• ${i.name}</div>`).join('');
    }
    function goHome() { renderHome(); }
    function closeModal() { document.getElementById('itemModal').style.display = 'none'; }
    function closeMealModal() { document.getElementById('mealModal').style.display = 'none'; }

    document.body.className = localStorage.getItem('wk_theme') || 'theme-sage';
    renderHome();
</script>
</body>
</html>
