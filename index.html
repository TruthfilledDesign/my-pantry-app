<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wong's Kitchen 🌿</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #EFE9E1; /* Deeper Warm Oatmeal */
            --card: #FDFBFA; /* Clotted Cream, not white */
            --text-main: #2D2926; --text-soft: #7C7874;
            --primary: #4A4A4A; --radius: 20px;
        }
        .theme-sage { --pop: #8ba888; }
        .theme-burgundy { --pop: #a64444; }
        .theme-navy { --pop: #5d7ba3; }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; -webkit-font-smoothing: antialiased; }
        h1, h2, .serif { font-family: 'Playfair Display', serif; }

        /* Header */
        .header-bg { background: var(--pop); padding: 60px 24px 40px; border-radius: 0 0 40px 40px; color: white; transition: 0.4s; position: relative; }
        .menu-trigger { position: absolute; top: 20px; left: 24px; background: rgba(255,255,255,0.2); border: none; padding: 10px; border-radius: 12px; color: white; cursor: pointer; }

        /* Sidebar - Slimmer */
        .side-panel { position: fixed; top: 0; left: -100%; width: 70%; height: 100%; background: var(--card); z-index: 1000; padding: 40px 20px; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 10px 0 30px rgba(0,0,0,0.05); }
        .side-panel.open { left: 0; }
        .overlay { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.15); backdrop-filter: blur(4px); z-index: 999; }

        /* Dashboard */
        .content { padding: 24px; padding-bottom: 120px; }
        .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .section-card { background: var(--card); padding: 20px; border-radius: var(--radius); box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.02); display: flex; flex-direction: column; cursor: pointer; }
        .section-card .icon-circle { width: 38px; height: 38px; background: var(--pop); border-radius: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; }

        /* Dynamic Detail View */
        .detail-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 500; transform: translateY(100%); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); padding: 30px 20px; box-sizing: border-box; overflow-y: auto; }
        .detail-view.active { transform: translateY(0); }
        .close-view-btn { position: absolute; top: 20px; right: 20px; background: var(--card); border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; }

        /* Compact Update Item Card */
        .modal-content { background: var(--card); width: 90%; max-width: 380px; padding: 24px; border-radius: 28px; font-size: 14px; }
        .modal-content input, .modal-content select, .modal-content textarea { padding: 10px; margin: 4px 0; border-radius: 10px; border: 1px solid #E5E1DA; background: #F9F8F6; font-size: 14px; }
        .toggle-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #F1EFEA; padding: 10px; border-radius: 12px; margin-top: 10px; }
        .toggle-item { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }

        /* Menu Planning List */
        .menu-plan-card { background: var(--card); margin-bottom: 15px; padding: 18px; border-radius: 18px; border-left: 4px solid var(--pop); }

        .fab { position: fixed; bottom: 30px; right: 24px; width: 60px; height: 60px; background: var(--primary); border-radius: 18px; color: white; border: none; font-size: 28px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); z-index: 800; }
        .hidden { display: none; }
    </style>
</head>
<body class="theme-sage">

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="side-panel" id="sidePanel">
    <h2 style="margin-top: 0;">Settings</h2>
    <label style="font-size: 11px; font-weight: 700; color: var(--text-soft); text-transform: uppercase;">Style</label>
    <select onchange="changeTheme(this.value)" style="width:100%; padding:10px; border-radius:8px; margin-bottom:30px;">
        <option value="theme-sage">Soft Sage</option>
        <option value="theme-burgundy">Muted Burgundy</option>
        <option value="theme-navy">Cool Navy</option>
    </select>

    <div style="font-size: 14px;">
        <h3 style="display:flex; align-items:center; gap:8px;">📋 Running Low</h3>
        <ul id="lowList" style="list-style: disc; padding-left: 20px; color: var(--text-soft);"></ul>
        
        <h3 style="display:flex; align-items:center; gap:8px; margin-top:20px;">🛒 Shopping List</h3>
        <ul id="shopList" style="list-style: disc; padding-left: 20px; color: var(--text-soft);"></ul>
    </div>
</div>

<div class="header-bg">
    <button class="menu-trigger" onclick="toggleMenu()">☰</button>
    <h1 style="margin:0;">Wong's Kitchen</h1>
</div>

<div class="content">
    <div class="section-grid" id="categoryGrid"></div>
</div>

<div id="dynamicDetail" class="detail-view">
    <button class="close-view-btn" onclick="closeDynamicView()">✕</button>
    <h2 id="dynamicTitle" style="font-size: 32px; margin-top: 20px;">Section</h2>
    <div id="sectionControls" style="margin-bottom: 20px;">
        <button onclick="deleteCurrentSection()" id="delBtn" style="color: #E27D60; background:none; border:none; padding:0; font-size:12px; font-weight:700;">DELETE SECTION</button>
    </div>
    <div id="dynamicItemList"></div>
</div>

<button class="fab" id="mainFab" onclick="openAddModal()">+</button>

<div id="itemModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); z-index:2000; align-items:center; justify-content:center;">
    <div class="modal-content">
        <h2 id="modalTitle" style="margin: 0 0 10px;">Item Details</h2>
        <input type="text" id="itemName" placeholder="Item Name">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
            <input type="number" id="itemQty" placeholder="Qty">
            <input type="text" id="itemUnit" placeholder="Unit (bag, oz)">
            <input type="text" id="itemPrice" placeholder="Price">
            <input type="date" id="itemDate">
        </div>
        <div style="display:grid; grid-template-columns: 1fr 3fr; gap:8px;">
            <input type="text" id="itemEmoji" placeholder="Emoji">
            <select id="itemSection"></select>
        </div>
        <input type="text" id="newSection" placeholder="Or create new category...">
        <textarea id="itemComments" rows="2" placeholder="Notes or Recipe..."></textarea>
        
        <div class="toggle-row">
            <label class="toggle-item"><input type="checkbox" id="itemLowManual"> Running Low</label>
            <label class="toggle-item"><input type="checkbox" id="itemOnShop"> Shopping List</label>
        </div>

        <button class="btn-action" onclick="saveItem()">Save Changes</button>
        <button onclick="closeModal()" style="width:100%; background:none; border:none; margin-top:8px; color:var(--text-soft); font-size:12px;">Cancel</button>
    </div>
</div>

<script>
    let inventory = JSON.parse(localStorage.getItem('kData')) || [];
    let sections = JSON.parse(localStorage.getItem('kSections')) || ["Fridge", "Pantry", "Baking", "Menu Planning"];
    let sectionEmojis = JSON.parse(localStorage.getItem('kEmojis')) || {"Fridge":"❄️", "Pantry":"🥫", "Baking":"🧁", "Drinks":"🥤", "Menu Planning":"🗓️"};
    let currentEditIdx = null;
    let currentOpenSection = "";

    function toggleMenu() {
        const panel = document.getElementById('sidePanel');
        panel.classList.toggle('open');
        document.getElementById('overlay').style.display = panel.classList.contains('open') ? 'block' : 'none';
        renderSidebarLists();
    }

    function renderDashboard() {
        const grid = document.getElementById('categoryGrid');
        grid.innerHTML = '';
        sections.forEach(s => {
            const count = inventory.filter(i => i.section === s).length;
            const card = document.createElement('div');
            card.className = 'section-card';
            card.onclick = () => openDynamicView(s);
            card.innerHTML = `<div class="icon-circle" style="background: ${s === 'Menu Planning' ? 'var(--text-main)' : 'var(--pop)'}">${sectionEmojis[s] || '✨'}</div><span style="font-size:10px; font-weight:700; color:var(--text-soft); text-transform:uppercase;">${count} items</span><b>${s}</b>`;
            grid.appendChild(card);
        });
    }

    function openDynamicView(section) {
        currentOpenSection = section;
        document.getElementById('dynamicTitle').innerText = section;
        document.getElementById('delBtn').style.display = (section === "Menu Planning") ? 'none' : 'block';
        
        const list = document.getElementById('dynamicItemList');
        list.innerHTML = '';
        
        if(section === "Menu Planning") {
            list.innerHTML = `<p style="font-size:14px; color:var(--text-soft)">Plan your meals using items in stock.</p>`;
        }

        inventory.forEach((item, idx) => {
            if(item.section !== section) return;
            const div = document.createElement('div');
            div.className = section === 'Menu Planning' ? 'menu-plan-card' : 'section-card';
            div.style.marginBottom = '10px';
            div.style.flexDirection = 'row';
            div.style.justifyContent = 'space-between';
            div.onclick = () => openEditModal(idx);
            div.innerHTML = `<div><b style="font-size:16px;">${item.name}</b><br><small style="color:var(--text-soft)">${item.qty} ${item.unit} ${item.price ? '• '+item.price : ''}</small></div><b>✎</b>`;
            list.appendChild(div);
        });
        document.getElementById('dynamicDetail').classList.add('active');
    }

    function openAddModal() {
        currentEditIdx = null;
        document.getElementById('modalTitle').innerText = "New Item / Dish";
        document.querySelectorAll('#itemModal input:not([type="checkbox"]), #itemModal textarea').forEach(i => i.value = '');
        document.getElementById('itemLowManual').checked = false;
        document.getElementById('itemOnShop').checked = false;
        populateSections();
        document.getElementById('itemModal').style.display = 'flex';
    }

    function openEditModal(idx) {
        currentEditIdx = idx;
        const item = inventory[idx];
        document.getElementById('modalTitle').innerText = "Update";
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemQty').value = item.qty;
        document.getElementById('itemUnit').value = item.unit;
        document.getElementById('itemPrice').value = item.price || '';
        document.getElementById('itemDate').value = item.date || '';
        document.getElementById('itemEmoji').value = item.emoji || '';
        document.getElementById('itemComments').value = item.comments || '';
        document.getElementById('itemLowManual').checked = item.isLow || false;
        document.getElementById('itemOnShop').checked = item.onShop || false;
        populateSections(item.section);
        document.getElementById('itemModal').style.display = 'flex';
    }

    function saveItem() {
        const name = document.getElementById('itemName').value;
        const newSec = document.getElementById('newSection').value;
        const emojiInput = document.getElementById('itemEmoji').value;
        let section = document.getElementById('itemSection').value;

        if(newSec) {
            if(!sections.includes(newSec)) sections.push(newSec);
            section = newSec;
        }
        if(emojiInput) sectionEmojis[section] = emojiInput;

        const data = {
            name, section, 
            qty: document.getElementById('itemQty').value, 
            unit: document.getElementById('itemUnit').value,
            price: document.getElementById('itemPrice').value,
            date: document.getElementById('itemDate').value,
            comments: document.getElementById('itemComments').value,
            isLow: document.getElementById('itemLowManual').checked,
            onShop: document.getElementById('itemOnShop').checked
        };

        if(currentEditIdx !== null) inventory[currentEditIdx] = data;
        else inventory.push(data);

        localStorage.setItem('kData', JSON.stringify(inventory));
        localStorage.setItem('kSections', JSON.stringify(sections));
        localStorage.setItem('kEmojis', JSON.stringify(sectionEmojis));
        closeModal();
        renderDashboard();
        if(document.getElementById('dynamicDetail').classList.contains('active')) openDynamicView(section);
    }

    function populateSections(selected = "") {
        const select = document.getElementById('itemSection');
        select.innerHTML = sections.map(s => `<option value="${s}" ${s === selected ? 'selected' : ''}>${s}</option>`).join('');
    }

    function deleteCurrentSection() {
        if(confirm("Delete section and all items within?")) {
            inventory = inventory.filter(i => i.section !== currentOpenSection);
            sections = sections.filter(s => s !== currentOpenSection);
            localStorage.setItem('kData', JSON.stringify(inventory));
            localStorage.setItem('kSections', JSON.stringify(sections));
            closeDynamicView();
            renderDashboard();
        }
    }

    function renderSidebarLists() {
        const low = inventory.filter(i => i.qty < 1 || i.isLow);
        const shop = inventory.filter(i => i.onShop);
        document.getElementById('lowList').innerHTML = low.length ? low.map(i => `<li>${i.name}</li>`).join('') : "<li>Fully Stocked</li>";
        document.getElementById('shopList').innerHTML = shop.length ? shop.map(i => `<li>${i.name}</li>`).join('') : "<li>Empty</li>";
    }

    function closeModal() { document.getElementById('itemModal').style.display = 'none'; }
    function closeDynamicView() { document.getElementById('dynamicDetail').classList.remove('active'); }
    function changeTheme(t) { document.body.className = t; localStorage.setItem('kT', t); }

    document.body.className = localStorage.getItem('kT') || 'theme-sage';
    renderDashboard();
</script>
</body>
</html>
