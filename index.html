<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wong's House</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        japandi: {
                            bg: '#efece4',
                            card: '#ffffff',
                            text: '#2c2b29',
                            sage: '#859582',
                            burgundy: '#8c595c',
                            border: '#ded8cc',
                            muted: '#7a756b'
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- HTML5 QRCode Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body { 
            background-color: #efece4; 
            color: #2c2b29; 
            -webkit-tap-highlight-color: transparent;
        }
        .pb-safe-area { padding-bottom: env(safe-area-inset-bottom, 12px); }
        .pt-safe-area { padding-top: env(safe-area-inset-top, 0px); }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slideUp { 
            from { transform: translateY(100%); } 
            to { transform: translateY(0); } 
        }
        @keyframes slideRight { 
            from { transform: translateX(-100%); } 
            to { transform: translateX(0); } 
        }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-right { animation: slideRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyARM7INioNJPClG9idtiR9pCdU_85CrvOQ",
            authDomain: "wongs-house.firebaseapp.com",
            projectId: "wongs-house",
            storageBucket: "wongs-house.firebasestorage.app",
            messagingSenderId: "878151358121",
            appId: "1:878151358121:web:714d89dd25ba04a4b2bbb8"       
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // --- Defaults ---
        const FOOD_DB = ["Almond Milk", "Apples", "Avocado", "Bacon", "Bananas", "Black Beans", "Bread", "Butter", "Carrots", "Cereal", "Cheddar Cheese", "Chicken Breast", "Coffee", "Eggs", "Garlic", "Greek Yogurt", "Ground Beef", "Honey", "Ketchup", "Lemon", "Lettuce", "Maple Syrup", "Olive Oil", "Onions", "Oatmeal", "Pasta", "Peanut Butter", "Potatoes", "Rice", "Soy Sauce", "Spinach", "Tomatoes"];
        const DEFAULT_STORES = ["Any Store", "Trader Joe's", "Costco", "Whole Foods", "Target", "Local Grocery", "Farmers Market"];
        const DEFAULT_BROAD_AREAS = ["Kitchen", "Cleaning", "Laundry"];
        const DEFAULT_SECTIONS_MAP = {
            "Kitchen": ["Fridge", "Produce", "Protein", "Pantry", "Freezer", "Household Essentials"],
            "Cleaning": ["Surface Cleaners", "Bathroom", "Tools & Supplies"],
            "Laundry": ["Detergent & Softener", "Stain Removers"]
        };
        const DEFAULT_ITEMS = [
            { id: '1', name: 'Almond Milk', qty: 1, threshold: 1, store: "Trader Joe's", broadArea: "Kitchen", section: "Fridge", notes: "Unsweetened vanilla", addedAt: Date.now() },
            { id: '2', name: 'Eggs', qty: 12, threshold: 6, store: 'Costco', broadArea: "Kitchen", section: "Fridge", notes: "", addedAt: Date.now() },
            { id: '3', name: 'Apples', qty: 2, threshold: 3, store: 'Any Store', broadArea: "Kitchen", section: "Produce", notes: "Fuji or Honeycrisp", addedAt: Date.now() },
            { id: '4', name: 'Garlic', qty: 0, threshold: 2, store: 'Any Store', broadArea: "Kitchen", section: "Produce", notes: "", addedAt: Date.now() },
            { id: '5', name: 'Paper Towels', qty: 1, threshold: 2, store: 'Target', broadArea: "Kitchen", section: "Household Essentials", notes: "Mega roll pack", addedAt: Date.now() },
            { id: '6', name: 'Disinfectant Spray', qty: 2, threshold: 1, store: 'Target', broadArea: "Cleaning", section: "Surface Cleaners", notes: "Lemon scent", addedAt: Date.now() }
        ];
        const DEFAULT_MEALS = [
            {
                id: 'm1',
                name: 'Garlic Chicken & Spinach Stir-Fry',
                days: ['Monday', 'Wednesday'],
                ingredients: [
                    { name: 'Chicken Breast', qtyNeeded: 1 },
                    { name: 'Garlic', qtyNeeded: 2 },
                    { name: 'Spinach', qtyNeeded: 1 }
                ]
            }
        ];
        const DAYS_OF_WEEK = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

        // --- Icons ---
        const IconHome = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>;
        const IconList = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>;
        const IconMeals = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>;
        const IconPlus = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M12 4v16m8-8H4"/></svg>;
        const IconMinus = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M20 12H4"/></svg>;
        const IconCamera = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>;
        const IconSearch = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>;
        const IconX = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M6 18L18 6M6 6l12 12"/></svg>;
        const IconTrash = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;
        const IconMenu = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M4 6h16M4 12h16M4 18h16"/></svg>;
        const IconChevronDown = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M19 9l-7 7-7-7"/></svg>;
        const IconChevronRight = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M9 5l7 7-7 7"/></svg>;
        const IconEdit = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>;
        const IconGrip = () => <svg className="w-4 h-4 text-japandi-muted/60 mr-2 flex-shrink-0 cursor-grab active:cursor-grabbing" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 8h16M4 16h16"/></svg>;

        function App() {
            const [items, setItems] = useState(DEFAULT_ITEMS);
            const [broadAreas, setBroadAreas] = useState(DEFAULT_BROAD_AREAS);
            const [sections, setSections] = useState(DEFAULT_SECTIONS_MAP);
            const [stores, setStores] = useState(DEFAULT_STORES);
            const [meals, setMeals] = useState(DEFAULT_MEALS);
            const [isLoaded, setIsLoaded] = useState(false);

            const [activeTab, setActiveTab] = useState('home');
            const [selectedBroadArea, setSelectedBroadArea] = useState(null);
            const [menuOpen, setMenuOpen] = useState(false);
            const [settingsTab, setSettingsTab] = useState('areas');

            const [modalMode, setModalMode] = useState(null);
            const [editingItem, setEditingItem] = useState(null);
            const [editingMeal, setEditingMeal] = useState(null);

            const [collapsedSections, setCollapsedSections] = useState({});
            const [collapsedStores, setCollapsedStores] = useState({});

            // Real-time Firestore Listener
            useEffect(() => {
                const docRef = db.collection("wongHouse").doc("mainData");
                
                const unsubscribe = docRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        if (data.items) setItems(data.items);
                        if (data.broadAreas) setBroadAreas(data.broadAreas);
                        if (data.sections) setSections(data.sections);
                        if (data.stores) setStores(data.stores);
                        if (data.meals) setMeals(data.meals);
                    } else {
                        docRef.set({
                            items: DEFAULT_ITEMS,
                            broadAreas: DEFAULT_BROAD_AREAS,
                            sections: DEFAULT_SECTIONS_MAP,
                            stores: DEFAULT_STORES,
                            meals: DEFAULT_MEALS
                        });
                    }
                    setIsLoaded(true);
                }, (error) => {
                    console.error("Cloud sync error:", error);
                    setIsLoaded(true);
                });

                return () => unsubscribe();
            }, []);

            const syncToCloud = (updatedItems, updatedAreas, updatedSections, updatedStores, updatedMeals) => {
                db.collection("wongHouse").doc("mainData").set({
                    items: updatedItems !== undefined ? updatedItems : items,
                    broadAreas: updatedAreas !== undefined ? updatedAreas : broadAreas,
                    sections: updatedSections !== undefined ? updatedSections : sections,
                    stores: updatedStores !== undefined ? updatedStores : stores,
                    meals: updatedMeals !== undefined ? updatedMeals : meals
                }).catch(err => console.error("Error saving to cloud:", err));
            };

            const handleUpdateSettings = (newAreas, newSections, newStores) => {
                const nextAreas = newAreas !== undefined ? newAreas : broadAreas;
                const nextSections = newSections !== undefined ? newSections : sections;
                const nextStores = newStores !== undefined ? newStores : stores;

                setBroadAreas(nextAreas);
                setSections(nextSections);
                setStores(nextStores);

                db.collection("wongHouse").doc("mainData").set({
                    items,
                    broadAreas: nextAreas,
                    sections: nextSections,
                    stores: nextStores,
                    meals
                }).catch(err => console.error("Error saving to cloud:", err));
            };

            const updateQty = (id, delta) => {
                const newItems = items.map(item => {
                    if (item.id === id) {
                        return { ...item, qty: Math.max(0, item.qty + delta) };
                    }
                    return item;
                });
                setItems(newItems);
                syncToCloud(newItems, undefined, undefined, undefined, undefined);
            };

            const saveItem = (savedItem) => {
                let newItems;
                if (modalMode === 'add') {
                    const existing = items.find(i => i.name.toLowerCase() === savedItem.name.toLowerCase() && i.store === savedItem.store && i.section === savedItem.section);
                    if (existing) {
                        newItems = items.map(i => i.id === existing.id ? { ...i, qty: i.qty + savedItem.qty, threshold: savedItem.threshold, notes: savedItem.notes } : i);
                    } else {
                        newItems = [{ ...savedItem, id: Date.now().toString(), addedAt: Date.now() }, ...items];
                    }
                } else {
                    newItems = items.map(i => i.id === savedItem.id ? savedItem : i);
                }
                setItems(newItems);
                syncToCloud(newItems, undefined, undefined, undefined, undefined);
            };

            const addQuickShoppingItem = (name, store) => {
                const newItem = {
                    id: Date.now().toString(),
                    name,
                    qty: 0,
                    threshold: 1,
                    store: store || 'Any Store',
                    broadArea: broadAreas[0] || 'Kitchen',
                    section: (sections[broadAreas[0]] || [])[0] || 'General',
                    notes: '',
                    addedAt: Date.now()
                };
                const newItems = [newItem, ...items];
                setItems(newItems);
                syncToCloud(newItems, undefined, undefined, undefined, undefined);
            };

            const addMultipleQuickShoppingItems = (names) => {
                const now = Date.now();
                const newItems = names.map((name, index) => ({
                    id: (now + index).toString(),
                    name,
                    qty: 0,
                    threshold: 1,
                    store: 'Any Store',
                    broadArea: broadAreas[0] || 'Kitchen',
                    section: (sections[broadAreas[0]] || [])[0] || 'General',
                    notes: '',
                    addedAt: now + index
                }));
                const updatedItems = [...newItems, ...items];
                setItems(updatedItems);
                syncToCloud(updatedItems, undefined, undefined, undefined, undefined);
            };

            const saveMeal = (savedMeal) => {
                let newMeals;
                if (modalMode === 'addMeal') {
                    newMeals = [{ ...savedMeal, id: Date.now().toString() }, ...meals];
                } else {
                    newMeals = meals.map(m => m.id === savedMeal.id ? savedMeal : m);
                }
                setMeals(newMeals);
                syncToCloud(undefined, undefined, undefined, undefined, newMeals);
            };

            const deleteMeal = (id) => {
                if (confirm('Remove this meal from your plan?')) {
                    const newMeals = meals.filter(m => m.id !== id);
                    setMeals(newMeals);
                    syncToCloud(undefined, undefined, undefined, undefined, newMeals);
                }
            };

            const deleteItem = (id) => {
                if (confirm('Remove this item completely from your list?')) {
                    const newItems = items.filter(i => i.id !== id);
                    setItems(newItems);
                    syncToCloud(newItems, undefined, undefined, undefined, undefined);
                }
            };

            const toggleSectionCollapse = (sec) => {
                setCollapsedSections(prev => ({ ...prev, [sec]: !prev[sec] }));
            };

            const toggleStoreCollapse = (store) => {
                setCollapsedStores(prev => ({ ...prev, [store]: !prev[store] }));
            };

            const addSectionToArea = (broadArea, newSec) => {
                const trimmed = newSec.trim();
                if (!trimmed) return;
                const currentList = sections[broadArea] || [];
                if (currentList.includes(trimmed)) return;
                const updatedSections = { ...sections, [broadArea]: [...currentList, trimmed] };
                setSections(updatedSections);
                syncToCloud(undefined, undefined, updatedSections, undefined, undefined);
            };

            if (!isLoaded) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-japandi-bg text-japandi-muted font-normal text-sm">
                        Loading Wong's House...
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-16 max-w-md mx-auto bg-japandi-bg relative font-sans text-japandi-text selection:bg-japandi-sage selection:text-white shadow-2xl overflow-hidden font-normal">
                    
                    <header className="pt-safe-area pt-14 pb-4 px-6 sticky top-0 bg-japandi-bg/95 backdrop-blur-md z-10 border-b border-japandi-border/60 flex justify-between items-center">
                        <div 
                            onClick={() => { setActiveTab('home'); setSelectedBroadArea(null); }}
                            className="cursor-pointer group"
                        >
                            <h1 className="text-xl font-medium tracking-tight text-japandi-text group-hover:text-japandi-sage transition-colors">
                                Wong's House
                            </h1>
                            <p className="text-xs text-japandi-muted font-normal mt-0.5">
                                {activeTab === 'home' ? (selectedBroadArea ? `${selectedBroadArea} Inventory` : 'Inventory') : activeTab === 'shopping' ? 'Shopping List' : 'Meal Planning'}
                            </p>
                        </div>
                        <button 
                            onClick={() => setMenuOpen(true)}
                            className="p-1 text-japandi-text hover:text-japandi-sage active:scale-95 transition-all"
                            title="Open Menu"
                        >
                            <IconMenu />
                        </button>
                    </header>

                    <main className="px-5 py-4">
                        {activeTab === 'home' ? (
                            selectedBroadArea === null ? (
                                <BroadAreasDashboard 
                                    broadAreas={broadAreas}
                                    sections={sections}
                                    items={items}
                                    onSelectArea={(area) => setSelectedBroadArea(area)}
                                />
                            ) : (
                                <BroadAreaDetailView 
                                    broadArea={selectedBroadArea}
                                    sections={sections[selectedBroadArea] || []}
                                    items={items}
                                    onBack={() => setSelectedBroadArea(null)}
                                    updateQty={updateQty}
                                    deleteItem={deleteItem}
                                    onEdit={(item) => { setEditingItem(item); setModalMode('edit'); }}
                                    collapsedSections={collapsedSections}
                                    toggleSectionCollapse={toggleSectionCollapse}
                                />
                            )
                        ) : activeTab === 'shopping' ? (
                            <ShoppingListView 
                                items={items} 
                                updateQty={updateQty}
                                deleteItem={deleteItem}
                                onEdit={(item) => { setEditingItem(item); setModalMode('edit'); }}
                                collapsedStores={collapsedStores}
                                toggleStoreCollapse={toggleStoreCollapse}
                                stores={stores}
                                onAddQuickItem={addQuickShoppingItem}
                            />
                        ) : (
                            <MealPlanningView 
                                meals={meals}
                                items={items}
                                stores={stores}
                                onAddMeal={() => { setEditingMeal(null); setModalMode('addMeal'); }}
                                onEditMeal={(meal) => { setEditingMeal(meal); setModalMode('editMeal'); }}
                                onDeleteMeal={deleteMeal}
                                onAddMultipleQuickItems={addMultipleQuickShoppingItems}
                            />
                        )}
                    </main>

                    {activeTab !== 'meals' && (
                        <button 
                            onClick={() => { setEditingItem(null); setModalMode('add'); }}
                            className="fixed bottom-20 right-6 w-14 h-14 bg-japandi-sage text-white rounded-full shadow-lg shadow-japandi-sage/30 flex items-center justify-center hover:bg-[#758472] active:scale-90 transition-transform z-20"
                            title="Add Item"
                        >
                            <IconPlus />
                        </button>
                    )}

                    <nav className="fixed bottom-0 w-full max-w-md bg-japandi-card border-t border-japandi-border flex justify-around items-center py-1.5 pb-safe-area shadow-[0_-10px_30px_rgba(0,0,0,0.04)] z-20">
                        <button 
                            onClick={() => { setActiveTab('home'); setSelectedBroadArea(null); }}
                            className={`flex flex-col items-center p-2.5 transition-colors ${activeTab === 'home' ? 'text-japandi-sage' : 'text-japandi-muted'}`}
                        >
                            <IconHome />
                            <span className="text-[11px] font-normal mt-0.5">Inventory</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('shopping')}
                            className={`flex flex-col items-center p-2.5 transition-colors ${activeTab === 'shopping' ? 'text-japandi-burgundy' : 'text-japandi-muted'}`}
                        >
                            <div className="relative">
                                <IconList />
                                {items.filter(i => i.qty <= i.threshold).length > 0 && (
                                    <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-japandi-burgundy rounded-full border border-japandi-card"></span>
                                )}
                            </div>
                            <span className="text-[11px] font-normal mt-0.5">Shopping</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('meals')}
                            className={`flex flex-col items-center p-2.5 transition-colors ${activeTab === 'meals' ? 'text-japandi-sage' : 'text-japandi-muted'}`}
                        >
                            <IconMeals />
                            <span className="text-[11px] font-normal mt-0.5">Meals</span>
                        </button>
                    </nav>

                    {menuOpen && (
                        <MenuDrawer 
                            onClose={() => setMenuOpen(false)}
                            broadAreas={broadAreas}
                            sections={sections}
                            stores={stores}
                            onUpdateSettings={handleUpdateSettings}
                            settingsTab={settingsTab}
                            setSettingsTab={setSettingsTab}
                            onNavigateArea={(area) => { setActiveTab('home'); setSelectedBroadArea(area); setMenuOpen(false); }}
                        />
                    )}

                    {(modalMode === 'add' || modalMode === 'edit') && (
                        <ItemModal 
                            mode={modalMode}
                            initialData={editingItem}
                            broadAreas={broadAreas}
                            sectionsMap={sections}
                            availableStores={stores}
                            onClose={() => setModalMode(null)} 
                            onSave={saveItem}
                            onAddSection={addSectionToArea}
                        />
                    )}

                    {(modalMode === 'addMeal' || modalMode === 'editMeal') && (
                        <MealModal 
                            mode={modalMode}
                            initialData={editingMeal}
                            stores={stores}
                            items={items}
                            onClose={() => setModalMode(null)}
                            onSave={saveMeal}
                        />
                    )}
                </div>
            );
        }

        function MealPlanningView({ meals, items, stores, onAddMeal, onEditMeal, onDeleteMeal, onAddMultipleQuickItems }) {
            const getInventoryQty = (ingredientName) => {
                const found = items.find(i => i.name.toLowerCase() === ingredientName.toLowerCase());
                return found ? found.qty : 0;
            };

            const handleSyncMissing = () => {
                let missingMap = {};
                meals.forEach(meal => {
                    meal.ingredients.forEach(ing => {
                        const inStock = getInventoryQty(ing.name);
                        if (inStock < ing.qtyNeeded) {
                            const needed = ing.qtyNeeded - inStock;
                            missingMap[ing.name] = (missingMap[ing.name] || 0) + needed;
                        }
                    });
                });

                const missingKeys = Object.keys(missingMap);
                if (missingKeys.length === 0) {
                    alert('You have all necessary ingredients in stock for your planned meals!');
                    return;

                onAddMultipleQuickItems(missingKeys);
                alert(`Added ${missingKeys.length} missing ingredient(s) to your shopping list!`);
            };

                if (!trimmed) return;

                if (settingsTab === 'areas') {
                    if (!broadAreas.includes(trimmed)) {
                        const updatedAreas = [...broadAreas, trimmed];
                        const updatedSections = sections[trimmed] ? sections : { ...sections, [trimmed]: [] };
                        onUpdateSettings(updatedAreas, updatedSections, undefined);
                    }
                } else if (settingsTab === 'sections') {
                    const currentList = sections[selectedAreaForSections] || [];
                    if (!currentList.includes(trimmed)) {
                        const updatedSections = { ...sections, [selectedAreaForSections]: [...currentList, trimmed] };
                        onUpdateSettings(undefined, updatedSections, undefined);
                    }
                } else {
                    if (!stores.includes(trimmed)) {
                        const updatedStores = [...stores, trimmed];
                        onUpdateSettings(undefined, undefined, updatedStores);
                    }
                }
                setNewVal('');
            };

            const handleDelete = (targetItem) => {
                if (settingsTab === 'areas') {
                    if (broadAreas.length <= 1) {
                        alert('You must have at least one broad area.');
                        return;
                    }
                    if (confirm(`Delete broad area "${targetItem}" and its sections?`)) {
                        const updatedAreas = broadAreas.filter(a => a !== targetItem);
                        const copy = { ...sections };
                        delete copy[targetItem];
                        onUpdateSettings(updatedAreas, copy, undefined);
                    }
                } else if (settingsTab === 'sections') {
                    const currentList = sections[selectedAreaForSections] || [];
                    const updatedList = currentList.filter(s => s !== targetItem);
                    const updatedSections = { ...sections, [selectedAreaForSections]: updatedList };
                    onUpdateSettings(undefined, updatedSections, undefined);
                } else {
                    if (stores.length <= 1) {
                        alert('You must have at least one store.');
                        return;
                    }
                    if (confirm(`Delete store "${targetItem}"?`)) {
                        const updatedStores = stores.filter(s => s !== targetItem);
                        onUpdateSettings(undefined, undefined, updatedStores);
                    }
                }
            };

            const handleDropItem = (fromIdx, toIdx) => {
                if (fromIdx === toIdx || isNaN(fromIdx)) return;

                if (settingsTab === 'areas') {
                    const updated = [...broadAreas];
                    const [moved] = updated.splice(fromIdx, 1);
                    updated.splice(toIdx, 0, moved);
                    onUpdateSettings(updated, undefined, undefined);
                } else if (settingsTab === 'sections') {
                    const currentList = [...(sections[selectedAreaForSections] || [])];
                    const [moved] = currentList.splice(fromIdx, 1);
                    currentList.splice(toIdx, 0, moved);
                    const updatedSections = { ...sections, [selectedAreaForSections]: currentList };
                    onUpdateSettings(undefined, updatedSections, undefined);
                } else {
                    const updated = [...stores];
                    const [moved] = updated.splice(fromIdx, 1);
                    updated.splice(toIdx, 0, moved);
                    onUpdateSettings(undefined, undefined, updated);
                }
            };

            const handleSaveEdit = (oldVal) => {
                const trimmed = editVal.trim();
                if (!trimmed) return;

                if (settingsTab === 'areas') {
                    if (broadAreas.includes(trimmed)) { setEditingIndex(null); return; }
                    const updatedAreas = broadAreas.map(a => a === oldVal ? trimmed : a);
                    const copy = { ...sections };
                    copy[trimmed] = copy[oldVal];
                    delete copy[oldVal];
                    onUpdateSettings(updatedAreas, copy, undefined);
                } else if (settingsTab === 'sections') {
                    const currentList = sections[selectedAreaForSections] || [];
                    if (currentList.includes(trimmed)) { setEditingIndex(null); return; }
                    const updatedList = currentList.map(s => s === oldVal ? trimmed : s);
                    const updatedSections = { ...sections, [selectedAreaForSections]: updatedList };
                    onUpdateSettings(undefined, updatedSections, undefined);
                } else {
                    if (stores.includes(trimmed)) { setEditingIndex(null); return; }
                    const updatedStores = stores.map(st => st === oldVal ? trimmed : st);
                    onUpdateSettings(undefined, undefined, updatedStores);
                }
                setEditingIndex(null);
                setEditVal('');
            };

            return (
                <div className="fixed inset-0 bg-japandi-text/30 backdrop-blur-sm z-50 flex justify-end" onClick={onClose}>
                    <div className="bg-white w-full max-w-xs h-full shadow-2xl flex flex-col animate-slide-right pb-safe-area" onClick={e => e.stopPropagation()}>
                        <div className="p-5 border-b border-japandi-border flex justify-between items-center bg-japandi-bg">
                            <h2 className="font-medium text-base text-japandi-text">Settings & Menu</h2>
                            <button onClick={onClose} className="p-1.5 rounded-lg bg-white border border-japandi-border text-japandi-muted hover:text-japandi-text">
                                <IconX />
                            </button>
                        </div>

                        <div className="p-4 border-b border-japandi-border bg-white">
                            <p className="text-[10px] font-medium text-japandi-muted uppercase tracking-wider mb-2">Quick Jump to Area</p>
                            <div className="flex flex-wrap gap-1.5">
                                {broadAreas.map(area => (
                                    <button 
                                        key={area}
                                        onClick={() => onNavigateArea(area)}
                                        className="text-xs font-normal bg-japandi-bg px-2.5 py-1.5 rounded-lg border border-japandi-border hover:bg-japandi-sage hover:text-white transition-all"
                                    >
                                        {area}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="flex border-b border-japandi-border bg-japandi-bg/50 p-2 gap-1">
                            <button 
                                onClick={() => { setSettingsTab('areas'); setEditingIndex(null); }}
                                className={`flex-1 py-1.5 text-[11px] font-medium rounded-lg transition-all ${settingsTab === 'areas' ? 'bg-white shadow-sm text-japandi-text border border-japandi-border' : 'text-japandi-muted'}`}
                            >
                                Areas
                            </button>
                            <button 
                                onClick={() => { setSettingsTab('sections'); setEditingIndex(null); }}
                                className={`flex-1 py-1.5 text-[11px] font-medium rounded-lg transition-all ${settingsTab === 'sections' ? 'bg-white shadow-sm text-japandi-text border border-japandi-border' : 'text-japandi-muted'}`}
                            >
                                Sections
                            </button>
                            <button 
                                onClick={() => { setSettingsTab('stores'); setEditingIndex(null); }}
                                className={`flex-1 py-1.5 text-[11px] font-medium rounded-lg transition-all ${settingsTab === 'stores' ? 'bg-white shadow-sm text-japandi-text border border-japandi-border' : 'text-japandi-muted'}`}
                            >
                                Stores
                            </button>
                        </div>

                        {settingsTab === 'sections' && (
                            <div className="p-3 bg-japandi-bg border-b border-japandi-border">
                                <label className="block text-[10px] font-medium text-japandi-muted uppercase tracking-wider mb-1">Select area</label>
                                <select 
                                    value={selectedAreaForSections}
                                    onChange={e => setSelectedAreaForSections(e.target.value)}
                                    className="w-full p-2 bg-white border border-japandi-border rounded-lg text-xs font-normal outline-none"
                                >
                                    {broadAreas.map(a => <option key={a} value={a}>{a}</option>)}
                                </select>
                            </div>
                        )}

                        <div className="flex-1 overflow-y-auto p-4 space-y-4">
                            <form onSubmit={handleAdd} className="flex gap-2">
                                <input 
                                    type="text"
                                    value={newVal}
                                    onChange={e => setNewVal(e.target.value)}
                                    placeholder={settingsTab === 'areas' ? 'New area name...' : settingsTab === 'sections' ? 'New section...' : 'New store...'}
                                    className="flex-1 p-2.5 text-sm bg-japandi-bg border border-japandi-border rounded-xl focus:ring-2 focus:ring-japandi-sage outline-none font-normal"
                                />
                                <button type="submit" className="px-3 bg-japandi-sage text-white rounded-xl text-xs font-medium shadow-sm hover:bg-[#758472]">
                                    Add
                                </button>
                            </form>

                            <div className="space-y-2 mt-1">
                                {settingsTab === 'areas' && broadAreas.map((item, idx) => (
                                    <div 
                                        key={item} 
                                        draggable
                                        onDragStart={(e) => e.dataTransfer.setData('text/plain', idx)}
                                        onDragOver={(e) => e.preventDefault()}
                                        onDrop={(e) => { e.preventDefault(); handleDropItem(parseInt(e.dataTransfer.getData('text/plain')), idx); }}
                                        className="p-3 bg-japandi-bg/50 border border-japandi-border rounded-xl flex items-center justify-between cursor-grab active:cursor-grabbing hover:bg-japandi-bg transition-colors"
                                    >
                                        <div className="flex items-center flex-1 mr-2 min-w-0">
                                            <IconGrip />
                                            {editingIndex === idx ? (
                                                <div className="flex gap-2 flex-1" onClick={e => e.stopPropagation()}>
                                                    <input type="text" autoFocus value={editVal} onChange={e => setEditVal(e.target.value)} className="flex-1 p-1 text-sm bg-white border rounded" />
                                                    <button onClick={() => handleSaveEdit(item)} className="px-2 bg-japandi-sage text-white text-xs rounded">Save</button>
                                                    <button onClick={() => setEditingIndex(null)} className="text-xs text-japandi-muted">Cancel</button>
                                                </div>
                                            ) : (
                                                <span className="font-normal text-sm text-japandi-text truncate">{item}</span>
                                            )}
                                        </div>
                                        {editingIndex !== idx && (
                                            <div className="flex items-center gap-1">
                                                <button onClick={() => { setEditingIndex(idx); setEditVal(item); }} className="p-1 text-japandi-muted hover:text-japandi-text"><IconEdit /></button>
                                                <button onClick={() => handleDelete(item)} className="p-1 text-japandi-muted hover:text-red-500"><IconTrash /></button>
                                            </div>
                                        )}
                                    </div>
                                ))}

                                {settingsTab === 'sections' && (sections[selectedAreaForSections] || []).map((item, idx) => (
                                    <div 
                                        key={item} 
                                        draggable
                                        onDragStart={(e) => e.dataTransfer.setData('text/plain', idx)}
                                        onDragOver={(e) => e.preventDefault()}
                                        onDrop={(e) => { e.preventDefault(); handleDropItem(parseInt(e.dataTransfer.getData('text/plain')), idx); }}
                                        className="p-2.5 bg-japandi-bg/50 border border-japandi-border rounded-xl flex items-center justify-between cursor-grab active:cursor-grabbing hover:bg-japandi-bg transition-colors"
                                    >
                                        <div className="flex items-center flex-1 mr-2 min-w-0">
                                            <IconGrip />
                                            {editingIndex === idx ? (
                                                <div className="flex gap-2 flex-1" onClick={e => e.stopPropagation()}>
                                                    <input type="text" autoFocus value={editVal} onChange={e => setEditVal(e.target.value)} className="flex-1 p-1 text-sm bg-white border rounded" />
                                                    <button onClick={() => handleSaveEdit(item)} className="px-2 bg-japandi-sage text-white text-xs rounded">Save</button>
                                                    <button onClick={() => setEditingIndex(null)} className="text-xs text-japandi-muted">Cancel</button>
                                                </div>
                                            ) : (
                                                <span className="font-normal text-xs text-japandi-text truncate">{item}</span>
                                            )}
                                        </div>

                                        {editingIndex !== idx && (
                                            <div className="flex items-center gap-1">
                                                <button onClick={() => { setEditingIndex(idx); setEditVal(item); }} className="p-1 text-japandi-muted hover:text-japandi-text"><IconEdit /></button>
                                                <button onClick={() => handleDelete(item)} className="p-1 text-japandi-muted hover:text-red-500"><IconTrash /></button>
                                            </div>
                                        )}
                                    </div>
                                ))}

                                {settingsTab === 'stores' && stores.map((item, idx) => (
                                    <div 
                                        key={item} 
                                        draggable
                                        onDragStart={(e) => e.dataTransfer.setData('text/plain', idx)}
                                        onDragOver={(e) => e.preventDefault()}
                                        onDrop={(e) => { e.preventDefault(); handleDropItem(parseInt(e.dataTransfer.getData('text/plain')), idx); }}
                                        className="p-3 bg-japandi-bg/50 border border-japandi-border rounded-xl flex items-center justify-between cursor-grab active:cursor-grabbing hover:bg-japandi-bg transition-colors"
                                    >
                                        <div className="flex items-center flex-1 mr-2 min-w-0">
                                            <IconGrip />
                                            {editingIndex === idx ? (
                                                <div className="flex gap-2 flex-1" onClick={e => e.stopPropagation()}>
                                                    <input type="text" autoFocus value={editVal} onChange={e => setEditVal(e.target.value)} className="flex-1 p-1 text-sm bg-white border rounded" />
                                                    <button onClick={() => handleSaveEdit(item)} className="px-2 bg-japandi-sage text-white text-xs rounded">Save</button>
                                                    <button onClick={() => setEditingIndex(null)} className="text-xs text-japandi-muted">Cancel</button>
                                                </div>
                                            ) : (
                                                <span className="font-normal text-sm text-japandi-text truncate">{item}</span>
                                            )}
                                        </div>
                                        {editingIndex !== idx && (
                                            <div className="flex items-center gap-1">
                                                <button onClick={() => { setEditingIndex(idx); setEditVal(item); }} className="p-1 text-japandi-muted hover:text-japandi-text"><IconEdit /></button>
                                                <button onClick={() => handleDelete(item)} className="p-1 text-japandi-muted hover:text-red-500"><IconTrash /></button>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="p-4 border-t border-japandi-border bg-japandi-bg text-center">
                            <p className="text-[11px] text-japandi-muted font-normal">Wong's House Cloud v2.18</p>
                        </div>
                    </div>
                </div>
            );
        }

        function ItemModal({ mode, initialData, broadAreas, sectionsMap, availableStores, onClose, onSave, onAddSection }) {
            const [name, setName] = useState(initialData?.name || '');
            const [qty, setQty] = useState(initialData?.qty ?? 1);
            const [threshold, setThreshold] = useState(initialData?.threshold ?? 1);
            const [store, setStore] = useState(initialData?.store || availableStores[0]);
            const [broadArea, setBroadArea] = useState(initialData?.broadArea || broadAreas[0]);
            
            const currentSections = sectionsMap[broadArea] || [];
            const [section, setSection] = useState(initialData?.section || currentSections[0] || 'General');
            const [notes, setNotes] = useState(initialData?.notes || '');
            
            const [isAddingNewSec, setIsAddingNewSec] = useState(false);
            const [newSecName, setNewSecName] = useState('');

            const [showSuggestions, setShowSuggestions] = useState(false);
            const [scanning, setScanning] = useState(false);
            const scannerRef = useRef(null);

            useEffect(() => {
                const validSecs = sectionsMap[broadArea] || [];
                if (!validSecs.includes(section) && validSecs.length > 0) {
                    setSection(validSecs[0]);
                }
            }, [broadArea]);

            const suggestions = useMemo(() => {
                if (!name) return [];
                return FOOD_DB.filter(f => f.toLowerCase().includes(name.toLowerCase()) && f.toLowerCase() !== name.toLowerCase()).slice(0, 4);
            }, [name]);

            const handleBroadAreaChange = (e) => {
                const newArea = e.target.value;
                setBroadArea(newArea);
                const secs = sectionsMap[newArea] || [];
                if (secs.length > 0) setSection(secs[0]);
            };

            const handleCreateSectionInline = (e) => {
                e.preventDefault();
                const trimmed = newSecName.trim();
                if (trimmed) {
                    onAddSection(broadArea, trimmed);
                    setSection(trimmed);
                }
                setIsAddingNewSec(false);
                setNewSecName('');
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!name.trim()) return;
                
                onSave({ 
                    id: initialData?.id,
                    name: name.trim(), 
                    qty, 
                    threshold, 
                    store, 
                    broadArea,
                    section,
                    notes 
                });
                onClose();
            };

            const startScanner = () => {
                setScanning(true);
                setTimeout(() => {
                    const html5QrcodeScanner = new Html5QrcodeScanner(
                        "reader",
                        { fps: 10, qrbox: {width: 250, height: 250}, aspectRatio: 1.0 },
                        false
                    );
                    html5QrcodeScanner.render(
                        (decodedText) => {
                            html5QrcodeScanner.clear();
                            setScanning(false);
                            setName("Scanned Item (" + decodedText.slice(-4) + ")");
                        },
                        (error) => { /* ignore */ }
                    );
                    scannerRef.current = html5QrcodeScanner;
                }, 150);
            };

            const stopScanner = () => {
                if (scannerRef.current) scannerRef.current.clear();
                setScanning(false);
            };

            return (
                <div className="fixed inset-0 bg-japandi-text/20 backdrop-blur-sm z-50 flex flex-col justify-end sm:justify-center sm:items-center p-0 sm:p-4">
                    <div className="bg-white sm:rounded-2xl rounded-t-3xl shadow-2xl w-full max-w-md pb-safe-area animate-slide-up flex flex-col max-h-[90vh]">
                        
                        <div className="flex justify-between items-center p-5 border-b border-japandi-border/60">
                            <h2 className="font-medium text-base text-japandi-text">{mode === 'add' ? 'Add Item' : 'Edit Item'}</h2>
                            <button onClick={() => { if(scanning) stopScanner(); onClose(); }} className="p-1.5 bg-japandi-bg rounded-md text-japandi-muted hover:text-japandi-text transition-colors">
                                <IconX />
                            </button>
                        </div>

                        <div className="overflow-y-auto hide-scroll p-5 space-y-4">
                            {scanning ? (
                                <div className="mb-4">
                                    <div id="reader" className="w-full bg-black rounded-xl overflow-hidden mb-4 border border-japandi-border"></div>
                                    <button type="button" onClick={stopScanner} className="w-full py-3 bg-japandi-bg text-japandi-text rounded-xl font-medium border border-japandi-border">
                                        Cancel Camera
                                    </button>
                                </div>
                            ) : (
                                <form id="itemForm" onSubmit={handleSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-japandi-muted uppercase tracking-wider mb-1.5">Item Name</label>
                                        <div className="flex gap-2 relative">
                                            <div className="relative flex-1">
                                                <input 
                                                    autoFocus={mode === 'add'}
                                                    type="text" 
                                                    required
                                                    value={name}
                                                    onChange={(e) => {
                                                        setName(e.target.value);
                                                        setShowSuggestions(true);
                                                    }}
                                                    onFocus={() => setShowSuggestions(true)}
                                                    onBlur={() => setTimeout(() => setShowSuggestions(false), 200)}
                                                    className="w-full p-3 bg-white border border-japandi-border rounded-xl focus:ring-2 focus:ring-japandi-sage outline-none font-normal text-sm"
                                                    placeholder="e.g. Oat Milk"
                                                />
                                                {showSuggestions && suggestions.length > 0 && (
                                                    <div className="absolute top-full left-0 right-0 mt-1 bg-white border border-japandi-border rounded-xl shadow-lg z-50 overflow-hidden text-sm">
                                                        {suggestions.map(s => (
                                                            <div 
                                                                key={s} 
                                                                className="p-3 hover:bg-japandi-bg cursor-pointer border-b border-japandi-border/40 last:border-0 font-normal"
                                                                onClick={() => { setName(s); setShowSuggestions(false); }}
                                                            >
                                                                {s}
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                            {mode === 'add' && (
                                                <button 
                                                    type="button" 
                                                    onClick={startScanner}
                                                    className="w-[46px] bg-white rounded-xl flex items-center justify-center text-japandi-sage border border-japandi-border hover:bg-japandi-bg transition-colors"
                                                    title="Scan Barcode"
                                                >
                                                    <IconCamera />
                                                </button>
                                            )}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-medium text-japandi-muted uppercase tracking-wider mb-1.5">Home Area</label>
                                        <select 
                                            value={broadArea} 
                                            onChange={handleBroadAreaChange}
                                            className="w-full p-3 bg-white border border-japandi-border rounded-xl focus:ring-2 focus:ring-japandi-sage outline-none font-normal text-sm appearance-none"
                                        >
                                            {broadAreas.map(a => <option key={a} value={a}>{a}</option>)}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-medium text-japandi-muted uppercase tracking-wider mb-1.5">Section</label>
                                        {!isAddingNewSec ? (
                                            <div className="flex gap-2">
                                                <select 
                                                    value={section} 
                                                    onChange={(e) => setSection(e.target.value)}
                                                    className="flex-1 p-3 bg-white border border-japandi-border rounded-xl focus:ring-2 focus:ring-japandi-sage outline-none font-normal text-sm appearance-none"
                                                >
                                                    {(sectionsMap[broadArea] || []).map(s => <option key={s} value={s}>{s}</option>)}
                                                </select>
                                                <button 
                                                    type="button"
                                                    onClick={() => setIsAddingNewSec(true)}
                                                    className="px-3.5 bg-japandi-bg border border-japandi-border rounded-xl text-xs font-medium text-japandi-text hover:bg-japandi-border transition-colors"
                                                >
                                                    + New
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="flex gap-2">
                                                <input 
                                                    type="text"
                                                    autoFocus
                                                    value={newSecName}
                                                    onChange={e => setNewSecName(e.target.value)}
                                                    placeholder="New section name..."
                                                    className="flex-1 p-2.5 bg-white border border-japandi-border rounded-xl text-sm outline-none font-normal"
                                                />
                                                <button 
                                                    type="button"
                                                    onClick={handleCreateSectionInline}
                                                    className="px-3 bg-japandi-sage text-white rounded-xl text-xs font-medium"
                                                >
                                                    Add
                                                </button>
                                                <button 
                                                    type="button"
                                                    onClick={() => setIsAddingNewSec(false)}
                                                    className="px-2 bg-japandi-bg text-japandi-muted rounded-xl border border-japandi-border"
                                                >
                                                    <IconX />
                                                </button>
                                            </div>
                                        )}
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-japandi-bg p-3 rounded-xl border border-japandi-border/60 flex flex-col items-center">
                                            <label className="text-[10px] font-medium text-japandi-muted uppercase tracking-wider mb-2">Quantity</label>
                                            <div className="flex items-center gap-2">
                                                <button type="button" onClick={() => setQty(Math.max(0, qty - 1))} className="w-7 h-7 bg-white rounded flex items-center justify-center text-japandi-muted shadow-sm border border-japandi-border/50"><IconMinus /></button>
                                                <input type="number" value={qty} onChange={e => setQty(parseInt(e.target.value)||0)} className="w-10 text-center font-normal text-base bg-transparent outline-none hide-scroll" />
                                                <button type="button" onClick={() => setQty(qty + 1)} className="w-7 h-7 bg-white rounded flex items-center justify-center text-japandi-muted shadow-sm border border-japandi-border/50"><IconPlus /></button>
                                            </div>
                                        </div>

                                        <div className="bg-japandi-bg p-3 rounded-xl border border-japandi-border/60 flex flex-col items-center">
                                            <label className="text-[10px] font-medium text-japandi-burgundy uppercase tracking-wider mb-2">Alert Threshold</label>
                                            <div className="flex items-center gap-2">
                                                <button type="button" onClick={() => setThreshold(Math.max(0, threshold - 1))} className="w-7 h-7 bg-white rounded flex items-center justify-center text-japandi-muted shadow-sm border border-japandi-border/50"><IconMinus /></button>
                                                <input type="number" value={threshold} onChange={e => setThreshold(parseInt(e.target.value)||0)} className="w-10 text-center font-normal text-base bg-transparent outline-none hide-scroll" />
                                                <button type="button" onClick={() => setThreshold(threshold + 1)} className="w-7 h-7 bg-white rounded flex items-center justify-center text-japandi-muted shadow-sm border border-japandi-border/50"><IconPlus /></button>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-medium text-japandi-muted uppercase tracking-wider mb-1.5">Store</label>
                                        <select 
                                            value={store} 
                                            onChange={(e) => setStore(e.target.value)}
                                            className="w-full p-3 bg-white border border-japandi-border rounded-xl focus:ring-2 focus:ring-japandi-sage outline-none font-normal text-sm appearance-none"
                                        >
                                            {availableStores.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-medium text-japandi-muted uppercase tracking-wider mb-1.5">Notes (Optional)</label>
                                        <textarea
                                            value={notes}
                                            onChange={(e) => setNotes(e.target.value)}
                                            rows="2"
                                            placeholder="Brands, sizes, or expiration dates..."
                                            className="w-full p-3 bg-white border border-japandi-border rounded-xl focus:ring-2 focus:ring-japandi-sage outline-none font-normal text-sm resize-none"
                                        ></textarea>
                                    </div>
                                </form>
                            )}
                        </div>

                        <div className="p-5 border-t border-japandi-border/60 bg-white sm:rounded-b-2xl">
                            <button type="submit" form="itemForm" className="w-full py-3.5 bg-[#2c2b29] text-white rounded-xl font-medium text-sm shadow-md hover:bg-black transition-all">
                                {mode === 'add' ? 'Save New Item' : 'Update Item'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
