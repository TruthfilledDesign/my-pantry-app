<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wong's Kitchen 🌿</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #E5DED3; /* Richer, Deeper Toasted Oatmeal */
            --panel: #DED6C9; /* Darker tonal oatmeal */
            --card: #F9F7F2; /* Creamy card color */
            --text-main: #2D2926; --text-soft: #635F5B;
            --radius: 20px;
        }
        /* Richer Jewel Tones */
        .theme-sage { --pop: #525B44; --header-text: #F9F7F2; }
        .theme-burgundy { --pop: #6B1D1D; --header-text: #F9F7F2; }
        .theme-navy { --pop: #1A2A3A; --header-text: #F9F7F2; }
        .theme-terracotta { --pop: #A0522D; --header-text: #F9F7F2; }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; display: flex; flex-direction: column; align-items: center; -webkit-font-smoothing: antialiased; }
        h1, h2, .serif { font-family: 'Playfair Display', serif; }

        .app-container { width: 100%; max-width: 480px; min-height: 100vh; position: relative; }

        /* Compact Header */
        .header-bg { background: var(--pop); padding: 40px 24px 24px; border-radius: 0 0 32px 32px; color: var(--header-text); text-align: center; position: relative; transition: 0.3s; }
        .menu-trigger { position: absolute; top: 15px; left: 20px; background: none; border: none; cursor: pointer; color: var(--header-text); font-size: 24px; padding: 5px; }

        /* Slimmer Menu */
        .side-panel { position: fixed; top: 0; left: -100%; width: 260px; height: 100%; background: var(--card); z-index: 1000; padding: 40px 20px; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .side-panel.open { left: 0; }
        .overlay { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.2); backdrop-filter: blur(4px); z-index: 999; }

        /* Compact Dashboard */
        .content { padding: 20px 40px; }
        .section-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .section-card { background: var(--panel); padding: 16px 20px; border-radius: var(--radius); display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; }
        .section-card:active { background: #D5CBBF; }
        .icon-no-box { font-size: 22px; width: 30px; text-align: center; }

        /* Detail View */
        .detail-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 500; transform: translateY(100%); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); padding: 30px; box-sizing: border-box; overflow-y: auto; }
        .detail-view.active { transform: translateY(0); }
        .close-view-btn { position: absolute; top: 20px; right: 20px; background: var(--card); border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* Forms & Modals */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); z-index:2000; align-items:center; justify-content:center; }
        .modal-content { background: var(--card); width: 85%; max-width: 340px; padding: 24px; border-radius: 24px; position: relative; }
        input, select, textarea { width: 100%; padding: 10px; margin: 4px 0; border-radius: 10px; border: 1px solid #E5E1DA; background: #F3F1ED; font-size: 14px; font-family: inherit; box-sizing: border-box; }
        .btn-action { background: var(--text-main); color: white; width: 100%; padding: 14px; border: none; border-radius: 50px; font-weight: 700; margin-top: 15px; cursor: pointer; }

        /* Menu Planning Specifics */
        .planner-group { background: var(--panel); padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        .planner-group h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-soft); }
        .ingredient-tag { display: inline-block; background: var(--card); padding: 4px 10px; border-radius: 8px; font-size: 12px; margin: 2px; border: 1px solid rgba(0,0,0,0.05); }

        .fab { position: fixed; bottom: 30px; right: 25px; width: 56px; height: 56px; background: var(--text-main); border-radius: 18px; color: white; border: none; font-size: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 800; }
    </style>
</head>
<body class="theme-sage">

<div class="app-container">
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div id="modalOverlay" class="modal" onclick="closeModalOnOutsideClick(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 id="modalTitle" style="margin-top:0;">Item Details</h2>
            <input type="text" id="itemName" placeholder="Item Name">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                <input type="number" id="itemQty" placeholder="Qty">
                <input type="text" id="itemUnit" placeholder="Unit">
                <input type="text" id="itemPrice" placeholder="Price">
                <input type="date" id="itemDate">
            </div>
            <select id="itemSection"></select>
            <select id="itemType">
                <option value="General">Type: General</option>
                <option value="Protein">Type: Protein</option>
                <option value="Vegetable">Type: Vegetable</option>
                <option value="Carb">Type: Carb</option>
            </select>
            <textarea id="itemComments" rows="2" placeholder="Notes..."></textarea>
            <div style="display:flex; justify-content:space-between; padding:10px; background:#ECE9E2; border-radius:12px; margin-top:10px;">
                <label style="font-size:11px; font-weight:700;"><input type="checkbox" id="itemLowManual"> LOW</label>
                <label style="font-size:11px; font-weight:700;"><input type="checkbox" id="itemOnShop"> SHOP</label>
            </div>
            <button class="btn-action" onclick="saveItem()">Save Changes</button>
        </div>
    </div>

    <div class="side-panel" id="sidePanel">
        <label style="font-size: 10px; font-weight: 800; color: var(--text-soft); text-transform: uppercase; letter-spacing: 1px;">Style</label>
        <select onchange="changeTheme(this.value)" style="width: 100%; margin-bottom: 30px;">
            <option value="theme-sage">Sage</option>
            <option value="theme-burgundy">Burgundy</option>
            <option value="theme-navy">Navy</option>
            <option value="theme-terracotta">Terracotta</option>
        </select>

        <div class="sidebar-section" onclick="openMenuPlanner()" style="cursor:pointer; font-weight:700; margin-bottom:25px;">🗓️ Menu Planning</div>
        
        <div style="font-size: 13px;">
            <div style="font-weight:800; color:var(--text-soft); margin-bottom:10px;">📋 RUNNING LOW</div>
            <div id="lowList"></div>
            <div style="font-weight:800; color:var(--text-soft); margin-top:20px; margin-bottom:10px;">🛒 SHOPPING LIST</div>
            <div id="shopList"></div>
        </div>
    </div>

    <div class="header-bg">
        <button class="menu-trigger" onclick="toggleMenu()">☰</button>
        <h1 style="margin:0; font-size: 32px;">Wong's Kitchen</h1>
    </div>

    <div class="content">
        <div class="section-grid" id="categoryGrid"></div>
    </div>

    <div id="dynamicDetail" class="detail-view">
        <button class="close-view-btn" onclick="closeDynamicView()">✕</button>
        <h2 id="dynamicTitle" style="font-size: 32px; margin-bottom: 20px;">Section</h2>
        <div id="dynamicItemList"></div>
    </div>

    <button class="fab" onclick="openAddModal()">+</button>
</div>

<script>
    let inventory = JSON.parse(localStorage.getItem('kData')) || [];
    let sections = JSON.parse(localStorage.getItem('kSections')) || ["Fridge", "Pantry", "Baking"];
    let sectionEmojis = JSON.parse(localStorage.getItem('kEmojis')) || {"Fridge":"❄️", "Pantry":"🥫", "Baking":"🧁"};
    let currentEditIdx = null;

    function toggleMenu() {
        document.getElementById('sidePanel').classList.toggle('open');
        document.getElementById('overlay').style.display = document.getElementById('sidePanel').classList.contains('open') ? 'block' : 'none';
        renderSidebarLists();
    }

    function renderDashboard() {
        const grid = document.getElementById('categoryGrid');
        grid.innerHTML = '';
        sections.forEach(s => {
            const count = inventory.filter(i => i.section === s).length;
            const card = document.createElement('div');
            card.className = 'section-card';
            card.onclick = () => openDynamicView(s);
            card.innerHTML = `<div class="icon-no-box" onclick="event.stopPropagation(); changeEmoji('${s}')">${sectionEmojis[s] || '✨'}</div>
                <div><b style="font-size:17px;">${s}</b><br><span style="font-size:10px; font-weight:700; color:var(--text-soft);">${count} ITEMS</span></div>`;
            grid.appendChild(card);
        });
    }

    function changeEmoji(section) {
        const e = prompt(`New emoji for ${section}:`, sectionEmojis[section]);
        if(e) { sectionEmojis[section] = e; localStorage.setItem('kEmojis', JSON.stringify(sectionEmojis)); renderDashboard(); }
    }

    function openDynamicView(section) {
        document.getElementById('dynamicTitle').innerText = section;
        const list = document.getElementById('dynamicItemList');
        list.innerHTML = '';
        inventory.forEach((item, idx) => {
            if(item.section !== section) return;
            const div = document.createElement('div');
            div.style = "background:var(--card); padding:15px; border-radius:15px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;";
            div.onclick = () => openEditModal(idx);
            div.innerHTML = `<div><b>${item.name}</b><br><small>${item.qty} ${item.unit}</small></div><b>✎</b>`;
            list.appendChild(div);
        });
        document.getElementById('dynamicDetail').classList.add('active');
    }

    function openMenuPlanner() {
        toggleMenu();
        document.getElementById('dynamicTitle').innerText = "Menu Planning";
        const list = document.getElementById('dynamicItemList');
        const proteins = inventory.filter(i => i.type === 'Protein').map(i => `<span class="ingredient-tag">${i.name}</span>`).join('');
        const veg = inventory.filter(i => i.type === 'Vegetable').map(i => `<span class="ingredient-tag">${i.name}</span>`).join('');
        const carbs = inventory.filter(i => i.type === 'Carb').map(i => `<span class="ingredient-tag">${i.name}</span>`).join('');
        
        list.innerHTML = `
            <div class="planner-group"><h4>Your Proteins</h4>${proteins || 'None marked'}</div>
            <div class="planner-group"><h4>Your Vegetables</h4>${veg || 'None marked'}</div>
            <div class="planner-group"><h4>Your Carbs</h4>${carbs || 'None marked'}</div>
            <textarea placeholder="Write your weekly menu plan here..." style="height:150px; background:var(--card); border:none;"></textarea>
        `;
        document.getElementById('dynamicDetail').classList.add('active');
    }

    function openAddModal() {
        currentEditIdx = null;
        document.getElementById('modalTitle').innerText = "New Item";
        document.querySelectorAll('#modalOverlay input, #modalOverlay textarea').forEach(i => i.value = '');
        populateSections();
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function openEditModal(idx) {
        currentEditIdx = idx;
        const item = inventory[idx];
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemQty').value = item.qty;
        document.getElementById('itemUnit').value = item.unit;
        document.getElementById('itemPrice').value = item.price || '';
        document.getElementById('itemDate').value = item.date || '';
        document.getElementById('itemType').value = item.type || 'General';
        document.getElementById('itemComments').value = item.comments || '';
        document.getElementById('itemLowManual').checked = item.isLow || false;
        document.getElementById('itemOnShop').checked = item.onShop || false;
        populateSections(item.section);
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModalOnOutsideClick(e) { if(e.target === document.getElementById('modalOverlay')) closeModal(); }
    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

    function saveItem() {
        const name = document.getElementById('itemName').value;
        const section = document.getElementById('itemSection').value;
        const data = {
            name, section, qty: document.getElementById('itemQty').value, unit: document.getElementById('itemUnit').value,
            price: document.getElementById('itemPrice').value, date: document.getElementById('itemDate').value,
            type: document.getElementById('itemType').value, comments: document.getElementById('itemComments').value,
            isLow: document.getElementById('itemLowManual').checked, onShop: document.getElementById('itemOnShop').checked
        };
        if(currentEditIdx !== null) inventory[currentEditIdx] = data;
        else inventory.push(data);
        localStorage.setItem('kData', JSON.stringify(inventory));
        closeModal();
        renderDashboard();
    }

    function renderSidebarLists() {
        const low = inventory.filter(i => i.qty < 1 || i.isLow);
        const shop = inventory.filter(i => i.onShop);
        document.getElementById('lowList').innerHTML = low.map(i => `<div onclick="toggleMenu(); openEditModal(${inventory.indexOf(i)})" style="padding:5px 0; cursor:pointer">• ${i.name}</div>`).join('');
        document.getElementById('shopList').innerHTML = shop.map(i => `<div onclick="toggleMenu(); openEditModal(${inventory.indexOf(i)})" style="padding:5px 0; cursor:pointer">• ${i.name}</div>`).join('');
    }

    function populateSections(sel = "") {
        document.getElementById('itemSection').innerHTML = sections.map(s => `<option value="${s}" ${s===sel?'selected':''}>${s}</option>`).join('');
    }

    function closeDynamicView() { document.getElementById('dynamicDetail').classList.remove('active'); }
    function changeTheme(t) { document.body.className = t; localStorage.setItem('kT', t); }
    document.body.className = localStorage.getItem('kT') || 'theme-sage';
    renderDashboard();
</script>
</body>
</html>
