<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wong's Kitchen 🌿</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #EAE4D9; --panel: #DCD3C1; --card: #FDFBFA;
            --text-main: #3E3A37; --text-soft: #7C7874; --radius: 18px;
        }
        .theme-sage { --pop: #A8B29C; --header-text: #2D3A2D; }
        .theme-burgundy { --pop: #B68576; --header-text: #4A1A1A; }
        .theme-navy { --pop: #6A7F8F; --header-text: #FDFBFA; }
        .theme-terracotta { --pop: #B07D62; --header-text: #FDFBFA; }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; display: flex; flex-direction: column; align-items: center; -webkit-font-smoothing: antialiased; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }

        .app-container { width: 100%; max-width: 480px; min-height: 100vh; position: relative; }

        /* Ultra Tight Header */
        .header-bg { background: var(--pop); padding: 15px 20px 12px; border-radius: 0 0 24px 24px; color: var(--header-text); text-align: center; position: relative; }
        .menu-trigger { position: absolute; top: 12px; left: 15px; background: none; border: none; cursor: pointer; color: var(--header-text); font-size: 20px; }
        .header-bg h1 { margin: 0; font-size: 24px; }

        /* Sidebar & Accordions */
        .side-panel { position: fixed; top: 0; left: -100%; width: 280px; height: 100%; background: var(--card); z-index: 1000; padding: 30px 20px; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 10px 0 40px rgba(0,0,0,0.08); overflow-y: auto; }
        .side-panel.open { left: 0; }
        .overlay { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.15); backdrop-filter: blur(4px); z-index: 999; }
        
        .accordion-btn { width: 100%; text-align: left; background: none; border: none; font-weight: 700; font-size: 16px; padding: 12px 0; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .accordion-content { display: none; padding: 10px 5px; font-size: 13px; }
        .accordion-content.active { display: block; }

        /* 2-Column Grid */
        .content { padding: 15px 20px; }
        .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .section-card { background: var(--panel); padding: 12px; border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; text-align: center; cursor: grab; transition: transform 0.2s; position: relative; }
        .section-card:active { cursor: grabbing; transform: scale(0.95); }
        .section-card .icon { font-size: 22px; margin-bottom: 4px; }
        .section-card b { font-size: 14px; }
        .section-card small { font-size: 9px; font-weight: 800; color: var(--text-soft); }

        /* Modals & Detail Views */
        .detail-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 500; transform: translateY(100%); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); padding: 30px 20px; box-sizing: border-box; overflow-y: auto; }
        .detail-view.active { transform: translateY(0); }
        .close-view-btn { position: absolute; top: 15px; right: 15px; background: var(--card); border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; }

        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); z-index:2000; align-items:center; justify-content:center; }
        .modal-content { background: var(--card); width: 88%; max-width: 340px; padding: 24px; border-radius: 28px; position: relative; }
        input, select, textarea { width: 100%; padding: 10px; margin: 4px 0; border-radius: 10px; border: 1px solid #E5E1DA; background: #F9F8F6; font-size: 14px; font-family: inherit; box-sizing: border-box; }
        
        .btn-action { background: var(--text-main); color: white; width: 100%; padding: 14px; border: none; border-radius: 50px; font-weight: 700; margin-top: 10px; cursor: pointer; }
        .btn-delete { background: none; color: #B68576; width: 100%; padding: 8px; border: none; font-size: 11px; font-weight: 700; margin-top: 8px; cursor: pointer; text-transform: uppercase; }

        .fab { position: fixed; bottom: 30px; right: 20px; width: 56px; height: 56px; background: var(--text-main); border-radius: 18px; color: white; border: none; font-size: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 800; }
        
        .drag-over { border: 2px dashed var(--text-soft); opacity: 0.5; }
    </style>
</head>
<body class="theme-sage">

<div class="app-container">
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    
    <div id="modalOverlay" class="modal" onclick="closeModalOnOutsideClick(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 id="modalTitle" style="margin-top:0; font-size: 20px;">Item Details</h2>
            <input type="text" id="itemName" placeholder="Item Name">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                <input type="number" id="itemQty" placeholder="Qty">
                <input type="text" id="itemUnit" placeholder="Unit">
            </div>
            <select id="itemSection"></select>
            <input type="text" id="newSection" placeholder="New Category...">
            <input type="text" id="itemTags" placeholder="Tags (e.g. Protein, Carb)">
            <textarea id="itemComments" rows="2" placeholder="Recipe or Notes..."></textarea>
            <button class="btn-action" onclick="saveItem()">Save Changes</button>
            <button id="deleteBtn" class="btn-delete" onclick="deleteItem()" style="display:none;">Delete Item</button>
        </div>
    </div>

    <div class="side-panel" id="sidePanel">
        <div onclick="openMenuPlanner()" style="cursor:pointer; font-weight:700; font-size:18px; margin-bottom:20px;">🗓️ Menu Planner</div>
        
        <button class="accordion-btn" onclick="toggleAccordion('lowAccordion')">📋 Running Low <span>▾</span></button>
        <div id="lowAccordion" class="accordion-content"></div>

        <button class="accordion-btn" onclick="toggleAccordion('shopAccordion')">🛒 Shopping List <span>▾</span></button>
        <div id="shopAccordion" class="accordion-content"></div>

        <div style="margin-top:30px;">
            <label style="font-size:10px; font-weight:800; color:var(--text-soft); text-transform:uppercase;">Theme</label>
            <select onchange="changeTheme(this.value)" style="width:100%;">
                <option value="theme-sage">Sage</option>
                <option value="theme-burgundy">Burgundy</option>
                <option value="theme-navy">Navy</option>
                <option value="theme-terracotta">Terracotta</option>
            </select>
        </div>
    </div>

    <div class="header-bg">
        <button class="menu-trigger" onclick="toggleMenu()">☰</button>
        <h1>Wong's Kitchen</h1>
    </div>

    <div class="content">
        <div class="section-grid" id="categoryGrid" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
    </div>

    <div id="dynamicDetail" class="detail-view">
        <button class="close-view-btn" onclick="closeDynamicView()">✕</button>
        <h2 id="dynamicTitle" style="font-size:28px; margin-top:0;">Section</h2>
        <div id="tagFilterContainer" class="chip-container" style="display:none;"></div>
        <div id="dynamicItemList"></div>
    </div>

    <button class="fab" onclick="openAddModal()">+</button>
</div>

<script>
    let inventory = JSON.parse(localStorage.getItem('kData')) || [];
    let sections = JSON.parse(localStorage.getItem('kSections')) || ["Fridge", "Pantry", "Baking", "Freezer"];
    let sectionEmojis = JSON.parse(localStorage.getItem('kEmojis')) || {"Fridge":"❄️", "Pantry":"🥫", "Baking":"🧁", "Freezer":"🧊"};
    let currentEditIdx = null;

    function renderDashboard() {
        const grid = document.getElementById('categoryGrid');
        grid.innerHTML = '';
        sections.forEach((s, index) => {
            const count = inventory.filter(i => i.section === s).length;
            const card = document.createElement('div');
            card.className = 'section-card';
            card.draggable = true;
            card.id = `section-${index}`;
            card.ondragstart = (e) => e.dataTransfer.setData("text", index);
            card.onclick = () => openDynamicView(s);
            card.innerHTML = `<div class="icon">${sectionEmojis[s] || '✨'}</div>
                <b>${s}</b><small>${count} ITEMS</small>`;
            grid.appendChild(card);
        });
    }

    // Drag and Drop Logic
    function allowDrop(e) { e.preventDefault(); }
    function drop(e) {
        e.preventDefault();
        const fromIndex = e.dataTransfer.getData("text");
        const toElement = e.target.closest('.section-card');
        if (!toElement) return;
        const toIndex = Array.from(toElement.parentNode.children).indexOf(toElement);
        
        const movedItem = sections.splice(fromIndex, 1)[0];
        sections.splice(toIndex, 0, movedItem);
        localStorage.setItem('kSections', JSON.stringify(sections));
        renderDashboard();
    }

    function toggleAccordion(id) {
        const content = document.getElementById(id);
        content.classList.toggle('active');
        if (content.classList.contains('active')) renderSidebarLists();
    }

    function renderSidebarLists() {
        const low = inventory.filter(i => i.qty < 1 || i.isLow);
        const shop = inventory.filter(i => i.onShop);
        document.getElementById('lowAccordion').innerHTML = low.map(i => `<div onclick="toggleMenu(); openEditModal(${inventory.indexOf(i)})" style="padding:6px 0; border-bottom:1px solid #f0f0f0;">• ${i.name}</div>`).join('') || "No items";
        document.getElementById('shopAccordion').innerHTML = shop.map(i => `<div onclick="toggleMenu(); openEditModal(${inventory.indexOf(i)})" style="padding:6px 0; border-bottom:1px solid #f0f0f0;">• ${i.name}</div>`).join('') || "No items";
    }

    function openDynamicView(section) {
        document.getElementById('dynamicTitle').innerText = section;
        const list = document.getElementById('dynamicItemList');
        list.innerHTML = '';
        inventory.forEach((item, idx) => {
            if(item.section !== section) return;
            const div = document.createElement('div');
            div.style = "background:var(--card); padding:15px; border-radius:15px; margin-bottom:10px; display:flex; justify-content:space-between;";
            div.onclick = () => openEditModal(idx);
            div.innerHTML = `<div><b>${item.name}</b><br><small>${item.qty} ${item.unit}</small></div><b>✎</b>`;
            list.appendChild(div);
        });
        document.getElementById('dynamicDetail').classList.add('active');
    }

    function openAddModal() {
        currentEditIdx = null;
        document.getElementById('deleteBtn').style.display = 'none';
        document.querySelectorAll('#modalOverlay input, #modalOverlay textarea').forEach(i => i.value = '');
        populateSections();
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function openEditModal(idx) {
        currentEditIdx = idx;
        const item = inventory[idx];
        document.getElementById('deleteBtn').style.display = 'block';
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemQty').value = item.qty;
        document.getElementById('itemUnit').value = item.unit;
        document.getElementById('itemTags').value = item.tags || '';
        document.getElementById('itemComments').value = item.comments || '';
        populateSections(item.section);
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function saveItem() {
        const newSec = document.getElementById('newSection').value;
        let section = document.getElementById('itemSection').value;
        if(newSec) { if(!sections.includes(newSec)) sections.push(newSec); section = newSec; }

        const data = {
            name: document.getElementById('itemName').value,
            section, qty: document.getElementById('itemQty').value, unit: document.getElementById('itemUnit').value,
            tags: document.getElementById('itemTags').value, comments: document.getElementById('itemComments').value
        };
        if(currentEditIdx !== null) inventory[currentEditIdx] = data;
        else inventory.push(data);
        localStorage.setItem('kData', JSON.stringify(inventory));
        localStorage.setItem('kSections', JSON.stringify(sections));
        document.getElementById('modalOverlay').style.display = 'none';
        renderDashboard();
    }

    function deleteItem() {
        if(confirm("Delete item?")) {
            inventory.splice(currentEditIdx, 1);
            localStorage.setItem('kData', JSON.stringify(inventory));
            document.getElementById('modalOverlay').style.display = 'none';
            renderDashboard();
            closeDynamicView();
        }
    }

    function populateSections(sel = "") {
        document.getElementById('itemSection').innerHTML = sections.map(s => `<option value="${s}" ${s===sel?'selected':''}>${s}</option>`).join('');
    }

    function toggleMenu() { document.getElementById('sidePanel').classList.toggle('open'); document.getElementById('overlay').style.display = document.getElementById('sidePanel').classList.contains('open') ? 'block' : 'none'; }
    function changeTheme(t) { document.body.className = t; localStorage.setItem('kT', t); }
    function closeModalOnOutsideClick(e) { if(e.target.id === 'modalOverlay') document.getElementById('modalOverlay').style.display = 'none'; }
    function closeDynamicView() { document.getElementById('dynamicDetail').classList.remove('active'); }

    document.body.className = localStorage.getItem('kT') || 'theme-sage';
    renderDashboard();
</script>
</body>
</html>
