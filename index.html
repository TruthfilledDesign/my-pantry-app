<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wong's Kitchen 🌿</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #EFE9E1; /* Rich Oatmeal */
            --panel: #E5DED3; /* Deeper Oatmeal for cards */
            --card: #FDFBFA; /* Clotted Cream for items */
            --text-main: #3E3A37;
            --text-soft: #7C7874;
            --primary: #4A4A4A;
            --radius: 24px;
        }
        .theme-sage { --pop: #8ba888; --header-text: #2D3A2D; }
        .theme-burgundy { --pop: #a64444; --header-text: #4A1A1A; }
        .theme-navy { --pop: #5d7ba3; --header-text: #1A2A3A; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            display: flex;
            flex-direction: column;
            align-items: center; /* Centers everything */
            -webkit-font-smoothing: antialiased;
        }
        
        h1, h2, .serif { font-family: 'Playfair Display', serif; }

        /* Centered App Container */
        .app-container {
            width: 100%;
            max-width: 500px; /* Forces large margins on desktop/tablets */
            min-height: 100vh;
            position: relative;
        }

        /* Header - Bold & Complementary */
        .header-bg { 
            background: var(--pop); 
            padding: 70px 30px 40px; 
            border-radius: 0 0 40px 40px; 
            color: var(--header-text); 
            text-align: center;
            position: relative;
        }
        .menu-trigger { 
            position: absolute; top: 20px; left: 24px; background: rgba(0,0,0,0.08); 
            border: none; padding: 10px; border-radius: 12px; cursor: pointer; color: var(--header-text); 
        }

        /* Sidebar - Slim & Modern */
        .side-panel { 
            position: fixed; top: 0; left: -100%; width: 280px; height: 100%; 
            background: var(--card); z-index: 1000; padding: 40px 24px; 
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 10px 0 40px rgba(0,0,0,0.08); 
        }
        .side-panel.open { left: 0; }
        .overlay { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.15); backdrop-filter: blur(6px); z-index: 999; }

        /* Centered Grid */
        .content { padding: 30px 40px; } /* Large side margins */
        .section-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .section-card { 
            background: var(--panel); padding: 24px; border-radius: var(--radius); 
            display: flex; align-items: center; gap: 20px; cursor: pointer;
            border: 1px solid rgba(0,0,0,0.03); transition: 0.2s;
        }
        .section-card:active { transform: scale(0.98); }
        .icon-circle { 
            width: 50px; height: 50px; background: var(--card); border-radius: 16px; 
            display: flex; align-items: center; justify-content: center; font-size: 24px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        /* Dynamic Detail View */
        .detail-view { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg); z-index: 500; transform: translateY(100%); 
            transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); padding: 40px 30px; 
            box-sizing: border-box; overflow-y: auto; 
        }
        .detail-view.active { transform: translateY(0); }
        .close-view-btn { 
            position: absolute; top: 20px; right: 24px; background: var(--card); 
            border: none; width: 44px; height: 44px; border-radius: 50%; 
            font-size: 18px; display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; 
        }

        /* Item Pills */
        .item-pill {
            background: var(--card); padding: 18px 24px; border-radius: 20px;
            margin-bottom: 12px; display: flex; justify-content: space-between; 
            align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        /* Forms - Unified Font & Compact */
        .modal-content { background: var(--card); width: 88%; max-width: 360px; padding: 28px; border-radius: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .modal-content h2 { margin-bottom: 20px; font-size: 24px; }
        input, select, textarea { 
            width: 100%; padding: 12px; margin: 6px 0; border-radius: 12px; 
            border: 1px solid #E5E1DA; background: #F9F8F6; font-size: 14px; 
            font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; 
        }
        .toggle-row { 
            display: flex; justify-content: space-between; background: #F1EFEA; 
            padding: 14px; border-radius: 16px; margin-top: 15px; 
        }
        .toggle-item { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--text-soft); }

        /* Modern Save Button */
        .btn-action { 
            background: var(--text-main); color: white; width: 100%; padding: 16px; 
            border: none; border-radius: 50px; font-weight: 700; font-size: 15px; 
            margin-top: 20px; cursor: pointer; transition: 0.3s;
        }
        .btn-action:active { background: var(--pop); }

        /* Lists */
        .sidebar-item-link { cursor: pointer; padding: 8px 0; display: block; }
        .sidebar-item-link:hover { color: var(--pop); }

        .fab { position: fixed; bottom: 40px; right: 30px; width: 64px; height: 64px; background: var(--text-main); border-radius: 24px; color: white; border: none; font-size: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); z-index: 800; }
    </style>
</head>
<body class="theme-sage">

<div class="app-container">
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="side-panel" id="sidePanel">
        <h2 style="margin-top: 0; font-size: 28px;">Settings</h2>
        
        <label style="font-size: 11px; font-weight: 800; color: var(--text-soft); text-transform: uppercase; letter-spacing: 1px;">Style</label>
        <select onchange="changeTheme(this.value)" style="width: 140px; display: block;">
            <option value="theme-sage">Sage</option>
            <option value="theme-burgundy">Burgundy</option>
            <option value="theme-navy">Navy</option>
        </select>

        <div style="margin-top: 40px;">
            <h3 style="font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 8px;">📋 Running Low</h3>
            <div id="lowList" style="margin-top: 10px;"></div>
            
            <h3 style="font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-top: 30px;">🛒 Shopping List</h3>
            <div id="shopList" style="margin-top: 10px;"></div>
        </div>
    </div>

    <div class="header-bg">
        <button class="menu-trigger" onclick="toggleMenu()">☰</button>
        <h1 style="margin:0; font-size: 36px;">Wong's Kitchen</h1>
    </div>

    <div class="content">
        <div class="section-grid" id="categoryGrid"></div>
    </div>

    <div id="dynamicDetail" class="detail-view">
        <button class="close-view-btn" onclick="closeDynamicView()">✕</button>
        <h2 id="dynamicTitle" style="font-size: 36px; margin-bottom: 10px;">Section</h2>
        <button onclick="deleteCurrentSection()" id="delBtn" style="color: #E27D60; background:none; border:none; padding:0; font-size:11px; font-weight:800; letter-spacing:1px; margin-bottom: 30px;">DELETE SECTION</button>
        <div id="dynamicItemList"></div>
    </div>

    <button class="fab" onclick="openAddModal()">+</button>
</div>

<div id="itemModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); z-index:2000; align-items:center; justify-content:center;">
    <div class="modal-content">
        <h2 id="modalTitle">Item Details</h2>
        <input type="text" id="itemName" placeholder="Item Name">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <input type="number" id="itemQty" placeholder="Qty">
            <input type="text" id="itemUnit" placeholder="Unit">
            <input type="text" id="itemPrice" placeholder="Price">
            <input type="date" id="itemDate">
        </div>
        <select id="itemSection"></select>
        <input type="text" id="newSection" placeholder="Or new category name...">
        <textarea id="itemComments" rows="3" placeholder="Notes or Recipe..."></textarea>
        
        <div class="toggle-row">
            <label class="toggle-item"><input type="checkbox" id="itemLowManual"> LOW</label>
            <label class="toggle-item"><input type="checkbox" id="itemOnShop"> SHOP</label>
        </div>

        <button class="btn-action" onclick="saveItem()">Save Changes</button>
        <button onclick="closeModal()" style="width:100%; background:none; border:none; margin-top:15px; color:var(--text-soft); font-size:12px; font-weight:700;">CANCEL</button>
    </div>
</div>

<script>
    let inventory = JSON.parse(localStorage.getItem('kData')) || [];
    let sections = JSON.parse(localStorage.getItem('kSections')) || ["Fridge", "Pantry", "Baking", "Menu Planning"];
    let sectionEmojis = JSON.parse(localStorage.getItem('kEmojis')) || {"Fridge":"❄️", "Pantry":"🥫", "Baking":"🧁", "Menu Planning":"🗓️"};
    let currentEditIdx = null;
    let currentOpenSection = "";

    function toggleMenu() {
        document.getElementById('sidePanel').classList.toggle('open');
        document.getElementById('overlay').style.display = document.getElementById('sidePanel').classList.contains('open') ? 'block' : 'none';
        renderSidebarLists();
    }

    function renderDashboard() {
        const grid = document.getElementById('categoryGrid');
        grid.innerHTML = '';
        sections.forEach(s => {
            const count = inventory.filter(i => i.section === s).length;
            const card = document.createElement('div');
            card.className = 'section-card';
            card.onclick = () => openDynamicView(s);
            card.innerHTML = `
                <div class="icon-circle" onclick="event.stopPropagation(); changeEmoji('${s}')">${sectionEmojis[s] || '✨'}</div>
                <div>
                    <b style="font-size: 20px;">${s}</b><br>
                    <span style="font-size:11px; font-weight:700; color:var(--text-soft); text-transform:uppercase;">${count} items</span>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function changeEmoji(section) {
        const newEmoji = prompt(`Enter a new emoji for ${section}:`, sectionEmojis[section]);
        if (newEmoji) {
            sectionEmojis[section] = newEmoji;
            localStorage.setItem('kEmojis', JSON.stringify(sectionEmojis));
            renderDashboard();
        }
    }

    function openDynamicView(section) {
        currentOpenSection = section;
        document.getElementById('dynamicTitle').innerText = section;
        document.getElementById('delBtn').style.display = (section === "Menu Planning") ? 'none' : 'block';
        const list = document.getElementById('dynamicItemList');
        list.innerHTML = '';
        inventory.forEach((item, idx) => {
            if(item.section !== section) return;
            const div = document.createElement('div');
            div.className = 'item-pill';
            div.onclick = () => openEditModal(idx);
            div.innerHTML = `<div><b style="font-size:16px;">${item.name}</b><br><small style="color:var(--text-soft)">${item.qty} ${item.unit}</small></div><b>✎</b>`;
            list.appendChild(div);
        });
        document.getElementById('dynamicDetail').classList.add('active');
    }

    function openAddModal() {
        currentEditIdx = null;
        document.getElementById('modalTitle').innerText = "New Item";
        document.querySelectorAll('#itemModal input:not([type="checkbox"]), #itemModal textarea').forEach(i => i.value = '');
        document.getElementById('itemLowManual').checked = false;
        document.getElementById('itemOnShop').checked = false;
        populateSections();
        document.getElementById('itemModal').style.display = 'flex';
    }

    function openEditModal(idx) {
        currentEditIdx = idx;
        const item = inventory[idx];
        document.getElementById('modalTitle').innerText = "Update Item";
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemQty').value = item.qty;
        document.getElementById('itemUnit').value = item.unit;
        document.getElementById('itemPrice').value = item.price || '';
        document.getElementById('itemDate').value = item.date || '';
        document.getElementById('itemComments').value = item.comments || '';
        document.getElementById('itemLowManual').checked = item.isLow || false;
        document.getElementById('itemOnShop').checked = item.onShop || false;
        populateSections(item.section);
        document.getElementById('itemModal').style.display = 'flex';
    }

    function saveItem() {
        const newSec = document.getElementById('newSection').value;
        let section = document.getElementById('itemSection').value;
        if(newSec) { if(!sections.includes(newSec)) sections.push(newSec); section = newSec; }

        const data = {
            name: document.getElementById('itemName').value,
            section, qty: document.getElementById('itemQty').value, unit: document.getElementById('itemUnit').value,
            price: document.getElementById('itemPrice').value, date: document.getElementById('itemDate').value,
            comments: document.getElementById('itemComments').value, isLow: document.getElementById('itemLowManual').checked,
            onShop: document.getElementById('itemOnShop').checked
        };

        if(currentEditIdx !== null) inventory[currentEditIdx] = data;
        else inventory.push(data);

        localStorage.setItem('kData', JSON.stringify(inventory));
        localStorage.setItem('kSections', JSON.stringify(sections));
        closeModal();
        renderDashboard();
        if(document.getElementById('dynamicDetail').classList.contains('active')) openDynamicView(section);
    }

    function renderSidebarLists() {
        const low = inventory.filter(i => i.qty < 1 || i.isLow);
        const shop = inventory.filter(i => i.onShop);
        
        const formatList = (items) => items.map(i => {
            const idx = inventory.indexOf(i);
            return `<div class="sidebar-item-link" onclick="toggleMenu(); openEditModal(${idx})">• ${i.name}</div>`;
        }).join('');

        document.getElementById('lowList').innerHTML = low.length ? formatList(low) : "<div style='font-size:12px; opacity:0.5'>None</div>";
        document.getElementById('shopList').innerHTML = shop.length ? formatList(shop) : "<div style='font-size:12px; opacity:0.5'>None</div>";
    }

    function populateSections(selected = "") {
        const select = document.getElementById('itemSection');
        select.innerHTML = sections.map(s => `<option value="${s}" ${s === selected ? 'selected' : ''}>${s}</option>`).join('');
    }

    function deleteCurrentSection() {
        if(confirm("Delete section?")) {
            inventory = inventory.filter(i => i.section !== currentOpenSection);
            sections = sections.filter(s => s !== currentOpenSection);
            localStorage.setItem('kData', JSON.stringify(inventory));
            localStorage.setItem('kSections', JSON.stringify(sections));
            closeDynamicView();
            renderDashboard();
        }
    }

    function closeModal() { document.getElementById('itemModal').style.display = 'none'; }
    function closeDynamicView() { document.getElementById('dynamicDetail').classList.remove('active'); }
    function changeTheme(t) { document.body.className = t; localStorage.setItem('kT', t); }

    document.body.className = localStorage.getItem('kT') || 'theme-sage';
    renderDashboard();
</script>
</body>
</html>
