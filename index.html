<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen HQ 🌿</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6b8e23; --bg: #f8faf9; --card: #ffffff; --text: #2d3436;
        }
        /* Color Palettes */
        .theme-green { --primary: #6b8e23; --bg: #f8faf9; }
        .theme-orange { --primary: #e67e22; --bg: #fffaf5; }
        .theme-blue { --primary: #3498db; --bg: #f5faff; }
        .theme-rose { --primary: #e84393; --bg: #fff5f8; }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding-bottom: 100px; transition: 0.3s; }
        .container { max-width: 500px; margin: auto; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .glass-card { background: var(--card); border-radius: 20px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.05); margin-bottom: 15px; cursor: pointer; }
        
        .section-label { font-weight: 700; font-size: 1.2rem; margin: 25px 0 15px; color: var(--primary); display: flex; justify-content: space-between; }
        
        .item-main { display: flex; justify-content: space-between; align-items: center; }
        .item-details { font-size: 0.85rem; color: #7f8c8d; margin-top: 8px; display: none; border-top: 1px solid #eee; padding-top: 8px; }
        .item-details.active { display: block; }

        .badge { background: #f1f3f0; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .low-stock { border-left: 5px solid #ff7675; }

        /* Floating Add Button & Settings Button */
        .fab { position: fixed; bottom: 30px; right: 30px; background: var(--primary); color: white; width: 60px; height: 60px; border-radius: 30px; border: none; font-size: 24px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); cursor: pointer; }
        .settings-btn { background: none; border: none; font-size: 24px; cursor: pointer; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 90%; max-width: 400px; padding: 25px; border-radius: 24px; max-height: 80vh; overflow-y: auto; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #eee; border-radius: 12px; font-family: inherit; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; }
        .btn-main { background: var(--primary); color: white; }
    </style>
</head>
<body class="theme-green">

<div class="container">
    <div class="header">
        <h1>Kitchen HQ</h1>
        <button class="settings-btn" onclick="toggleModal('settingsModal')">⚙️</button>
    </div>

    <div id="inventoryDisplay"></div>
</div>

<div id="itemModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Add Item</h2>
        <input type="text" id="itemName" placeholder="Item Name (e.g. Flour)">
        <div style="display: flex; gap: 10px;">
            <input type="number" id="itemQty" placeholder="Qty">
            <input type="text" id="itemUnit" placeholder="Unit (bag, can, oz)">
        </div>
        <select id="itemSection"></select>
        <input type="text" id="newSection" placeholder="Or type a new section name...">
        <input type="text" id="itemPrice" placeholder="Purchase Price (Optional)">
        <input type="date" id="itemDate">
        <textarea id="itemComments" placeholder="Comments (Optional)"></textarea>
        <div class="btn-group">
            <button class="btn" onclick="toggleModal('itemModal')">Cancel</button>
            <button class="btn btn-main" onclick="saveItem()">Save Item</button>
        </div>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h2>Settings</h2>
        <label>App Theme</label>
        <select onchange="changeTheme(this.value)">
            <option value="theme-green">Sage Green</option>
            <option value="theme-orange">Sunset Orange</option>
            <option value="theme-blue">Ocean Blue</option>
            <option value="theme-rose">Desert Rose</option>
        </select>
        <button class="btn btn-main" style="margin-top:20px" onclick="toggleModal('settingsModal')">Close</button>
    </div>
</div>

<button class="fab" onclick="showAddModal()">+</button>

<script>
    let inventory = JSON.parse(localStorage.getItem('kitchenData')) || [];
    let sections = JSON.parse(localStorage.getItem('kitchenSections')) || ["Fridge", "Pantry", "Drinks"];
    let editingIndex = null;

    function render() {
        const display = document.getElementById('inventoryDisplay');
        display.innerHTML = '';

        sections.forEach(section => {
            const sectionItems = inventory.filter(i => i.section === section);
            if (sectionItems.length === 0 && section !== "Fridge") return;

            const sectionDiv = document.createElement('div');
            sectionDiv.innerHTML = `<div class="section-label">${section} <span>${sectionItems.length}</span></div>`;
            
            sectionItems.forEach(item => {
                const idx = inventory.indexOf(item);
                const card = document.createElement('div');
                card.className = `glass-card ${item.qty <= 1 ? 'low-stock' : ''}`;
                card.onclick = (e) => toggleDetails(e, idx);
                card.innerHTML = `
                    <div class="item-main">
                        <strong>${item.name}</strong>
                        <span class="badge">${item.qty} ${item.unit}</span>
                    </div>
                    <div id="details-${idx}" class="item-details">
                        <p>💰 Price: ${item.price || 'N/A'} | 📅 Date: ${item.date || 'N/A'}</p>
                        <p>💬 ${item.comments || 'No comments'}</p>
                        <div class="btn-group">
                            <button class="btn" onclick="adjustQty(${idx}, -1)">-1</button>
                            <button class="btn" onclick="adjustQty(${idx}, 1)">+1</button>
                            <button class="btn" onclick="deleteItem(${idx})">🗑️</button>
                        </div>
                    </div>
                `;
                sectionDiv.appendChild(card);
            });
            display.appendChild(sectionDiv);
        });
        localStorage.setItem('kitchenData', JSON.stringify(inventory));
        localStorage.setItem('kitchenSections', JSON.stringify(sections));
    }

    function toggleModal(id) {
        const m = document.getElementById(id);
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        populateSectionDropdown();
    }

    function populateSectionDropdown() {
        const select = document.getElementById('itemSection');
        select.innerHTML = sections.map(s => `<option value="${s}">${s}</option>`).join('');
    }

    function showAddModal() {
        editingIndex = null;
        document.getElementById('modalTitle').innerText = "Add Item";
        document.getElementById('itemName').value = '';
        toggleModal('itemModal');
    }

    function saveItem() {
        const name = document.getElementById('itemName').value;
        const qty = parseFloat(document.getElementById('itemQty').value);
        const unit = document.getElementById('itemUnit').value;
        const price = document.getElementById('itemPrice').value;
        const date = document.getElementById('itemDate').value;
        const comments = document.getElementById('itemComments').value;
        let section = document.getElementById('itemSection').value;
        const customSec = document.getElementById('newSection').value;

        if (customSec) {
            if (!sections.includes(customSec)) sections.push(customSec);
            section = customSec;
        }

        const itemData = { name, qty, unit, section, price, date, comments };
        
        inventory.push(itemData);
        render();
        toggleModal('itemModal');
    }

    function toggleDetails(e, idx) {
        if(e.target.tagName === 'BUTTON') return;
        document.getElementById(`details-${idx}`).classList.toggle('active');
    }

    function adjustQty(idx, amt) {
        inventory[idx].qty = Math.max(0, inventory[idx].qty + amt);
        render();
    }

    function deleteItem(idx) {
        inventory.splice(idx, 1);
        render();
    }

    function changeTheme(theme) {
        document.body.className = theme;
        localStorage.setItem('kitchenTheme', theme);
    }

    // Load theme
    document.body.className = localStorage.getItem('kitchenTheme') || 'theme-green';
    render();
</script>
</body>
</html>
