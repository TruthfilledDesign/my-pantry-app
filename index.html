<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen HQ 🌿</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5d6d3e; --bg: #fdfaf5; --card: #ffffff; --text: #3d3d3d; --shadow: rgba(0,0,0,0.08);
        }
        /* Rich Warm Palettes */
        .theme-sage { --primary: #5d6d3e; --bg: #f7f8f2; }
        .theme-burgundy { --primary: #6b1d1d; --bg: #fcf6f6; }
        .theme-terracotta { --primary: #b35a38; --bg: #fdf8f5; }
        .theme-navy { --primary: #2c3e50; --bg: #f4f7f9; }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; transition: 0.4s; overflow-x: hidden; }
        
        /* Header & Navigation */
        header { padding: 20px; display: flex; align-items: center; background: var(--card); box-shadow: 0 2px 10px var(--shadow); position: sticky; top: 0; z-index: 10; }
        .menu-icon { font-size: 24px; cursor: pointer; margin-right: 15px; background: none; border: none; }
        
        /* Sidebar Panel */
        .side-panel { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: var(--card); box-shadow: 5px 0 20px var(--shadow); transition: 0.3s; z-index: 100; padding: 20px; box-sizing: border-box; }
        .side-panel.open { left: 0; }
        .overlay { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); z-index: 90; }

        /* Dashboard Grid */
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .category-card { background: var(--card); padding: 25px 15px; border-radius: 20px; text-align: center; box-shadow: 0 4px 15px var(--shadow); cursor: pointer; transition: 0.2s; border: 1px solid rgba(0,0,0,0.03); }
        .category-card:active { transform: scale(0.95); }
        .category-card h3 { margin: 10px 0 5px; color: var(--primary); }

        /* Item List View */
        .view-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .item-row { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 8px var(--shadow); display: flex; justify-content: space-between; align-items: center; }
        .low-tag { color: #e63946; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }

        /* Forms & Modals */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:200; align-items:center; justify-content:center; }
        .modal-content { background:white; width:90%; max-width:400px; padding:25px; border-radius:24px; max-height: 90vh; overflow-y:auto; }
        input, select, textarea { width:100%; padding:12px; margin:8px 0; border:1px solid #eee; border-radius:12px; font-family:inherit; }
        .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; width: 100%; margin-top: 10px; }
        
        .fab { position: fixed; bottom: 30px; right: 30px; background: var(--primary); color: white; width: 60px; height: 60px; border-radius: 30px; border: none; font-size: 28px; box-shadow: 0 10px 20px var(--shadow); cursor: pointer; z-index: 80; }
        .hidden { display: none; }
    </style>
</head>
<body class="theme-sage">

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="side-panel" id="sidePanel">
    <h2>Settings & Alerts</h2>
    <hr>
    <h4>Theme Color</h4>
    <select onchange="changeTheme(this.value)">
        <option value="theme-sage">Warm Sage</option>
        <option value="theme-burgundy">Rich Burgundy</option>
        <option value="theme-terracotta">Warm Terracotta</option>
        <option value="theme-navy">Deep Navy</option>
    </select>

    <h4 style="margin-top:30px">⚠️ Running Low</h4>
    <div id="lowStockSidebar" style="font-size: 0.9rem; color: #666;"></div>
</div>

<header>
    <button class="menu-icon" onclick="toggleMenu()">☰</button>
    <h2 id="pageTitle" style="margin:0">Kitchen Dashboard</h2>
</header>

<div class="container">
    <div id="dashboardView">
        <div class="category-grid" id="categoryGrid"></div>
    </div>

    <div id="sectionView" class="hidden">
        <div class="view-header">
            <button class="btn" onclick="showDashboard()">← Back</button>
            <h2 id="currentSectionTitle">Section Name</h2>
        </div>
        <div id="itemList"></div>
    </div>
</div>

<button class="fab" onclick="openAddModal()">+</button>

<div id="itemModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Edit Item</h2>
        <input type="text" id="itemName" placeholder="Item Name">
        <div style="display:flex; gap:10px;">
            <input type="number" id="itemQty" placeholder="Qty">
            <input type="text" id="itemUnit" placeholder="Unit (bag, can)">
        </div>
        <select id="itemSection"></select>
        <input type="text" id="newSection" placeholder="Or new section name...">
        <input type="text" id="itemPrice" placeholder="Price">
        <input type="date" id="itemDate">
        <textarea id="itemComments" rows="3" placeholder="Comments..."></textarea>
        <label style="font-size: 0.9rem;"><input type="checkbox" id="itemLowManual"> Mark as "Running Low" manually</label>
        <button class="btn btn-primary" onclick="saveItem()">Save Changes</button>
        <button class="btn" style="width:100%; margin-top:5px; background:none;" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
    let inventory = JSON.parse(localStorage.getItem('kitchenData')) || [];
    let sections = JSON.parse(localStorage.getItem('kitchenSections')) || ["Fridge", "Pantry", "Baking", "Drinks"];
    let currentEditIdx = null;

    function toggleMenu() {
        const panel = document.getElementById('sidePanel');
        const overlay = document.getElementById('overlay');
        panel.classList.toggle('open');
        overlay.style.display = panel.classList.contains('open') ? 'block' : 'none';
        renderLowStockSidebar();
    }

    function renderDashboard() {
        const grid = document.getElementById('categoryGrid');
        grid.innerHTML = '';
        sections.forEach(s => {
            const count = inventory.filter(i => i.section === s).length;
            const card = document.createElement('div');
            card.className = 'category-card';
            card.onclick = () => showSection(s);
            card.innerHTML = `<h3>${s}</h3><p>${count} Items</p>`;
            grid.appendChild(card);
        });
    }

    function showSection(sectionName) {
        document.getElementById('dashboardView').classList.add('hidden');
        document.getElementById('sectionView').classList.remove('hidden');
        document.getElementById('currentSectionTitle').innerText = sectionName;
        renderItems(sectionName);
    }

    function showDashboard() {
        document.getElementById('dashboardView').classList.remove('hidden');
        document.getElementById('sectionView').classList.add('hidden');
        renderDashboard();
    }

    function renderItems(sectionName) {
        const list = document.getElementById('itemList');
        list.innerHTML = '';
        inventory.forEach((item, idx) => {
            if(item.section !== sectionName) return;
            const isLow = item.qty < 1 || item.isLow;
            const row = document.createElement('div');
            row.className = 'item-row';
            row.onclick = () => openEditModal(idx);
            row.innerHTML = `
                <div>
                    <strong>${item.name}</strong><br>
                    <small>${item.qty} ${item.unit}</small>
                    ${isLow ? '<br><span class="low-tag">⚠️ Low Stock</span>' : ''}
                </div>
                <div style="color:var(--primary); font-size:1.2rem;">✎</div>
            `;
            list.appendChild(row);
        });
    }

    function openEditModal(idx = null) {
        currentEditIdx = idx;
        const select = document.getElementById('itemSection');
        select.innerHTML = sections.map(s => `<option value="${s}">${s}</option>`).join('');
        
        if (idx !== null) {
            const item = inventory[idx];
            document.getElementById('modalTitle').innerText = "Edit Item";
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemQty').value = item.qty;
            document.getElementById('itemUnit').value = item.unit;
            document.getElementById('itemSection').value = item.section;
            document.getElementById('itemPrice').value = item.price || '';
            document.getElementById('itemDate').value = item.date || '';
            document.getElementById('itemComments').value = item.comments || '';
            document.getElementById('itemLowManual').checked = item.isLow || false;
        } else {
            document.getElementById('modalTitle').innerText = "Add New Item";
            document.querySelectorAll('#itemModal input, #itemModal textarea').forEach(i => i.value = '');
            document.getElementById('itemLowManual').checked = false;
        }
        document.getElementById('itemModal').style.display = 'flex';
    }

    function saveItem() {
        const newSec = document.getElementById('newSection').value;
        let section = document.getElementById('itemSection').value;
        if(newSec) {
            if(!sections.includes(newSec)) sections.push(newSec);
            section = newSec;
        }

        const data = {
            name: document.getElementById('itemName').value,
            qty: parseFloat(document.getElementById('itemQty').value),
            unit: document.getElementById('itemUnit').value,
            section: section,
            price: document.getElementById('itemPrice').value,
            date: document.getElementById('itemDate').value,
            comments: document.getElementById('itemComments').value,
            isLow: document.getElementById('itemLowManual').checked
        };

        if(currentEditIdx !== null) inventory[currentEditIdx] = data;
        else inventory.push(data);

        localStorage.setItem('kitchenData', JSON.stringify(inventory));
        localStorage.setItem('kitchenSections', JSON.stringify(sections));
        closeModal();
        showDashboard();
    }

    function renderLowStockSidebar() {
        const container = document.getElementById('lowStockSidebar');
        const lowItems = inventory.filter(i => i.qty < 1 || i.isLow);
        container.innerHTML = lowItems.length ? 
            lowItems.map(i => `• ${i.name} (${i.qty} ${i.unit})`).join('<br>') : 
            "Everything is fully stocked! ✨";
    }

    function closeModal() { document.getElementById('itemModal').style.display = 'none'; }
    function changeTheme(t) { document.body.className = t; localStorage.setItem('kTheme', t); }

    document.body.className = localStorage.getItem('kTheme') || 'theme-sage';
    renderDashboard();
</script>
</body>
</html>
